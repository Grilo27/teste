<title>Rinha de Galo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
  :root{--bg:#1a3a08;color-scheme:dark;}
  html,body{height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:0;margin:0;}
  #wrap{position:relative;width:100%;max-width:960px;}
  canvas{display:block;width:100%;aspect-ratio:16/9;border:3px solid #5a3500;box-shadow:0 0 40px rgba(0,100,0,.35),0 0 80px rgba(0,40,0,.25);}
  #hint{color:#3a5a20;font-family:monospace;font-size:9px;text-align:center;letter-spacing:.5px;margin-top:2px;}
  #ctrl{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 5px 5px;box-sizing:border-box;pointer-events:none;z-index:10;}
  @media(pointer:fine){#ctrl{display:none;}}
  .pctrl{display:flex;flex-direction:column;gap:4px;pointer-events:all;}
  .pctrl-row{display:flex;gap:4px;align-items:center;}
  .pctrl-r .pctrl-row{justify-content:flex-end;}
  .tb{
    width:clamp(36px,7.8vw,54px);height:clamp(36px,7.8vw,54px);
    border-radius:50%;border:none;cursor:pointer;
    font-size:clamp(13px,2.6vw,19px);font-weight:bold;line-height:1;
    user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
    transition:filter .08s,transform .08s;opacity:.88;
  }
  .tb-move{background:rgba(40,90,20,.88);color:#c0f080;border:2px solid rgba(100,180,50,.65);}
  .tb-jump{background:rgba(20,65,150,.88);color:#90d8ff;border:2px solid rgba(60,140,245,.65);}
  .tb-atk {background:rgba(155,58,12,.88);color:#ffb870;border:2px solid rgba(235,115,35,.65);}
  .tb-spur{background:rgba(120,12,120,.88);color:#ffaaee;border:2px solid rgba(215,45,215,.65);}
  .tb-spec{background:rgba(70,30,150,.88);color:#e8c8ff;border:2px solid rgba(180,100,255,.65);}
  .tb:active{filter:brightness(1.6);transform:scale(.9);}
  #rot{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);color:#afe080;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    z-index:999;text-align:center;padding:24px;font-family:'Bebas Neue',sans-serif;
    font-size:clamp(18px,5vw,32px);}
  #rot svg{width:56px;opacity:.75;animation:rot-anim 1.8s ease-in-out infinite;}
  @keyframes rot-anim{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
  @media(orientation:portrait){#rot{display:flex;}}
</style>
<div id="rot">
  <svg viewBox="0 0 24 24" fill="none" stroke="#afe080" stroke-width="1.4"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 21h6"/><circle cx="12" cy="18.5" r=".8" fill="#afe080"/></svg>
  GIRE O CELULAR
  <span style="font-size:.58em;color:#6a9050;display:block">Landscape para jogar</span>
</div>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ctrl">
    <div class="pctrl">
      <div class="pctrl-row">
        <button class="tb tb-move" id="p1l">◀</button>
        <button class="tb tb-move" id="p1r">▶</button>
        <button class="tb tb-jump" id="p1j">▲</button>
      </div>
      <div class="pctrl-row">
        <button class="tb tb-atk"  id="p1a">⚔</button>
        <button class="tb tb-spur" id="p1s">⚡</button>
        <button class="tb tb-spec" id="p1x">★</button>
      </div>
    </div>
    <div class="pctrl pctrl-r">
      <div class="pctrl-row">
        <button class="tb tb-jump" id="p2j">▲</button>
        <button class="tb tb-move" id="p2l">◀</button>
        <button class="tb tb-move" id="p2r">▶</button>
      </div>
      <div class="pctrl-row">
        <button class="tb tb-spec" id="p2x">★</button>
        <button class="tb tb-spur" id="p2s">⚡</button>
        <button class="tb tb-atk"  id="p2a">⚔</button>
      </div>
    </div>
  </div>
</div>
<div id="hint">P1: W/A/D · F=bicada · G=esporão · H=especial &nbsp;|&nbsp; P2: ↑/←/→ · Enter · Bksp · /</div>

/* ── particles ───────────────────────────────────────────────────── */
const PT=[];
function spawnP(x,y,n,hue){
  for(let i=0;i<n;i++){
    const a=rr(0,Math.PI*2),s=rr(1.5,6);
    PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,dec:rr(.04,.09),hue,sz:rr(2.5,5.5)});
  }
}
function tickP(){
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=p.dec;
    if(p.life<=0)PT.splice(i,1);
  }
}
function drawP(){
  for(const p of PT){
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=hsl(p.hue,82,62);
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

/* ── screen shake ─────────────────────────────────────────────────── */
let sx=0,sy=0,sm=0;
function shake(m){sm=Math.max(sm,m);}
function tickShake(){if(sm>.2){sx=rr(-sm,sm);sy=rr(-sm,sm);sm*=.7;}else sx=sy=sm=0;}
let ultAnn='',ultAnnT=0,ultAnnCol='#fff',ultFlash=0;
function triggerUltAnn(name,col){ultAnn=name;ultAnnT=130;ultAnnCol=col||'#fff';ultFlash=18;}
function drawUltAnn(){
  if(ultFlash>0){
    ctx.save();ctx.globalAlpha=Math.min(.55,ultFlash/18*.55);
    ctx.fillStyle=ultAnnCol;ctx.fillRect(0,0,W,H);
    ctx.restore();ultFlash--;
  }
  if(ultAnnT>0){
    const a=ultAnnT>110?((130-ultAnnT)/20):(ultAnnT/30);
    ctx.save();ctx.globalAlpha=Math.min(1,a);ctx.textAlign='center';
    ctx.font='bold 42px Georgia';
    ctx.shadowColor=ultAnnCol;ctx.shadowBlur=28;
    ctx.fillStyle=ultAnnCol;
    ctx.fillText('★ '+ultAnn+' ★',W/2,H/2-24);
    ctx.shadowBlur=0;ctx.font='bold 18px Georgia';ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText('ULT ESPECIAL',W/2,H/2+8);
    ctx.restore();ultAnnT--;
  }
}

/* ── input ───────────────────────────────────────────────────────── */
const K={};
const KQ=[];
window.addEventListener('keydown',e=>{K[e.code]=true;KQ.push(e.code);e.preventDefault();});
window.addEventListener('keyup',  e=>{K[e.code]=false;});

function tbPress(code,down){K[code]=down;if(down)KQ.push(code);}
(()=>{
  const map={p1l:'KeyA',p1r:'KeyD',p1j:'KeyW',p1a:'KeyF',p1s:'KeyG',p1x:'KeyH',
             p2l:'ArrowLeft',p2r:'ArrowRight',p2j:'ArrowUp',p2a:'Enter',p2s:'Backspace',p2x:'Slash'};
  for(const[id,code]of Object.entries(map)){
    const el=document.getElementById(id);if(!el)continue;
    const on=()=>tbPress(code,true),off=()=>tbPress(code,false);
    el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
    el.addEventListener('touchend',  e=>{e.preventDefault();off();},{passive:false});
    el.addEventListener('touchcancel',off);
    el.addEventListener('mousedown',on);
    el.addEventListener('mouseup',off);
    el.addEventListener('mouseleave',off);
  }
})();

function rectsOvlp(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

/* ── Player ──────────────────────────────────────────────────────── */
class Player{
  constructor(c){
    Object.assign(this,{
      name:c.name,startX:c.startX,x:c.startX,y:GROUND_Y-64,
      vx:0,vy:0,w:52,h:64,facing:c.facing,ctrl:c.ctrl,
      feathers:c.feathers,comb:c.comb,element:c.element,
      maxHp:100,hp:100,grounded:false,canJump:false,jumpCount:0,
      atkCD:0,spurCD:0,atkTimer:0,spurTimer:0,hitTimer:0,
      dead:false,deathAnim:0,animT:0,wingFlap:0,state:'idle',
      ability:c.ability,
      burning:0,frozen:0,stunned:0,poisoned:0,phaseFrames:0,
      specialCD:0,frenesiTimer:0,slamming:false,
    });
  }
  reset(){
    this.x=this.startX;this.y=GROUND_Y-64;
    this.vx=this.vy=0;this.hp=this.maxHp;this.grounded=false;
    this.atkCD=this.spurCD=this.atkTimer=this.spurTimer=this.hitTimer=0;
    this.dead=false;this.deathAnim=0;this.state='idle';this.jumpCount=0;
    this.burning=this.frozen=this.stunned=this.poisoned=this.phaseFrames=0;
    this.specialCD=this.frenesiTimer=0;this.slamming=false;
  }
  update(other){
    if(this.dead){this.deathAnim=Math.min(this.deathAnim+.05,1);return;}
    if(this.atkCD>0)this.atkCD--;
    if(this.spurCD>0)this.spurCD--;
    if(this.hitTimer>0)this.hitTimer--;
    if(this.atkTimer>0)this.atkTimer--;
    if(this.spurTimer>0)this.spurTimer--;

    // tick status effects
    if(this.burning>0){
      this.burning--;
      if(this.burning%8===0){this.hp=Math.max(0,this.hp-.9);spawnP(this.x+this.w/2,this.y+30,2,15);}
      if(this.hp<=0)this.dead=true;
    }
    if(this.frozen>0)this.frozen--;
    if(this.stunned>0)this.stunned--;
    if(this.poisoned>0){
      this.poisoned--;
      if(this.poisoned%10===0){this.hp=Math.max(0,this.hp-.65);spawnP(this.x+this.w/2,this.y+30,2,130);}
      if(this.hp<=0)this.dead=true;
    }
    if(this.phaseFrames>0)this.phaseFrames--;

    const L=K[this.ctrl.left],R=K[this.ctrl.right],
          J=K[this.ctrl.jump],A=K[this.ctrl.atk],S=K[this.ctrl.spur],SP=K[this.ctrl.special];
    if(this.specialCD>0)this.specialCD--;
    if(this.frenesiTimer>0)this.frenesiTimer--;
    const frozenMult=this.frozen>0?0.32:1;
    const stunnedBlock=this.stunned>0;
    const frenesi=this.element==='rage'&&this.frenesiTimer>0;
    const rageBoost=this.element==='rage'?(frenesi?2.5:1+(1-this.hp/this.maxHp)*1.8):1;
    const rageSpd=this.element==='rage'?(frenesi?2.2:1+(1-this.hp/this.maxHp)*.6):1;
    const spd=this.ability.speed*frozenMult*rageSpd;

    if(!L&&!R&&other)this.facing=other.x>this.x?1:-1;
    if(L){this.vx=-spd;this.facing=-1;}
    else if(R){this.vx=spd;this.facing=1;}
    else{this.vx*=.72;}

    if(J&&this.canJump&&!stunnedBlock){
      if(this.grounded){
        this.vy=-13.5;this.grounded=false;this.canJump=false;this.wingFlap=12;this.jumpCount=1;
      } else if(this.ability.dblJump&&this.jumpCount===1){
        this.vy=-11;this.canJump=false;this.wingFlap=14;this.jumpCount=2;
      }
    }
    if(!J)this.canJump=true;
    if(A&&this.atkCD===0&&this.atkTimer===0&&!stunnedBlock){this.atkTimer=14;this.atkCD=this.ability.atkCD;}
    if(S&&this.spurCD===0&&this.spurTimer===0&&!stunnedBlock){
      this.spurTimer=20;this.spurCD=this.ability.spurCD;
      if(this.element==='ghost')this.phaseFrames=42;
    }
    if(SP&&this.specialCD===0&&!stunnedBlock){
      this.specialCD=this.ability.specialCD;
      this._triggerSpecial(other);
    }

    const wasGrounded=this.grounded,prevFallVy=this.vy;
    this.vy+=.62;this.x+=this.vx;this.y+=this.vy;
    this.grounded=false;
    for(const p of PLATFORMS){
      if(this.x+this.w>p.x+4&&this.x<p.x+p.w-4&&
         this.vy>=0&&this.y+this.h>p.y&&this.y+this.h<p.y+p.h+22){
        this.y=p.y-this.h;this.vy=0;this.grounded=true;this.jumpCount=0;
      }
    }
    // titan earthquake on hard landing
    if(!wasGrounded&&this.grounded&&prevFallVy>9&&this.element==='titan'&&other&&!other.dead){
      const slam=this.slamming;
      const dist=Math.abs((this.x+this.w/2)-(other.x+other.w/2));
      const range=slam?W:140;
      if(dist<range){
        const dmg=Math.round((slam?50:20)*other.ability.defMult);
        other.hp=Math.max(0,other.hp-dmg);other.hitTimer=48;
        other.vx=this.facing*( slam?12:6)*this.ability.kbMult;other.vy=-(slam?10:4.5);
        spawnP(this.x+this.w/2,this.y+this.h,slam?36:20,30);shake(slam?14:7);
        if(other.hp<=0)other.dead=true;
      }
      this.slamming=false;
    }
    this.x=clamp(this.x,0,W-this.w);
    if(this.y>H+60){this.y=GROUND_Y-this.h;this.vy=0;}
    if(this.wingFlap>0)this.wingFlap--;
    if(Math.abs(this.vx)>.5&&this.grounded)this.animT++;

    if(this.hitTimer>20)this.state='hit';
    else if(this.atkTimer>0)this.state='peck';
    else if(this.spurTimer>0)this.state='spur';
    else if(!this.grounded)this.state='air';
    else if(Math.abs(this.vx)>.6)this.state='walk';
    else this.state='idle';

    if(other&&!other.dead&&other.hitTimer===0&&other.phaseFrames===0){
      const eHPeck={fire:20,lightning:58,ice:198,shadow:285,earth:30,poison:130,rage:5,vampire:345,ghost:230,titan:32};
      const eHSpur={fire:15,lightning:55,ice:200,shadow:280,earth:28,poison:125,rage:8,vampire:340,ghost:228,titan:30};
      if(this.atkTimer>0){
        const hx=this.x+(this.facing>0?this.w+4:-38);
        if(rectsOvlp(hx,this.y+4,38,24,other.x,other.y,other.w,other.h)){
          const dmg=Math.round(this.ability.atkDmg*other.ability.defMult*rageBoost);
          other.hp=Math.max(0,other.hp-dmg);other.hitTimer=28;
          other.vx=this.facing*3.5*this.ability.kbMult;other.vy=-2.5*this.ability.kbMult;
          if(this.element==='fire')   other.burning=Math.max(other.burning,80);
          if(this.element==='poison') other.poisoned=Math.min(210,other.poisoned+62);
          if(this.element==='vampire'){this.hp=Math.min(this.maxHp,this.hp+Math.round(dmg*.4));spawnP(this.x+this.w/2,this.y+22,5,345);}
          spawnP(other.x+other.w/2,other.y+12,9,eHPeck[this.element]||0);shake(3);
          if(other.hp<=0)other.dead=true;
        }
      }
      if(this.spurTimer>5){
        const hx=this.x+(this.facing>0?this.w-10:-48);
        if(rectsOvlp(hx,this.y+26,52,34,other.x,other.y,other.w,other.h)){
          const dmg=Math.round(this.ability.spurDmg*other.ability.defMult*rageBoost);
          other.hp=Math.max(0,other.hp-dmg);other.hitTimer=40;
          other.vx=this.facing*7.5*this.ability.kbMult;other.vy=-5.5*this.ability.kbMult;
          if(this.element==='fire')      other.burning=Math.max(other.burning,200);
          if(this.element==='lightning'){other.stunned=Math.max(other.stunned,55);spawnP(other.x+other.w/2,other.y+20,14,60);}
          if(this.element==='ice')       other.frozen =Math.max(other.frozen,110);
          if(this.element==='poison')    other.poisoned=Math.min(240,other.poisoned+100);
          if(this.element==='vampire'){this.hp=Math.min(this.maxHp,this.hp+Math.round(dmg*.5));spawnP(this.x+this.w/2,this.y+22,8,345);}
          spawnP(other.x+other.w/2,other.y+32,16,eHSpur[this.element]||18);shake(8);
          if(other.hp<=0)other.dead=true;
        }
      }
    }
  }
  draw(){
    ctx.save();
    const cx=this.x+this.w/2,base=this.y+this.h;
    if(this.dead){
      const ang=this.deathAnim*Math.PI*.5*(this.facing>0?-1:1);
      ctx.translate(cx,base);ctx.rotate(ang);ctx.translate(-cx,-base);
    }
    // ground shadow
    if(!this.dead){
      ctx.save();ctx.globalAlpha=this.grounded?.34:.16;
      ctx.fillStyle='#000';ctx.beginPath();
      ctx.ellipse(cx,base+3,this.grounded?40:26,7,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    const flash=this.hitTimer>0&&Math.floor(this.hitTimer/3)%2===0;
    const phasing=this.phaseFrames>0;
    if(!this.dead)_drawElementAura(ctx,cx,base,this);
    if(flash)ctx.globalAlpha=.3;
    if(phasing)ctx.globalAlpha=(ctx.globalAlpha||1)*.42;
    _drawRooster(ctx,cx,base,this);
    ctx.restore();
    if(this.atkTimer>8)this._peckFx(cx,base);
    if(this.spurTimer>10)this._spurFx(cx,base);
  }
  _peckFx(cx,base){
    const f=this.facing,ex=cx+f*42,ey=base-54;
    const ec={lightning:'rgba(255,245,80,.85)',fire:'rgba(255,100,10,.85)',
              ice:'rgba(130,220,255,.85)',shadow:'rgba(210,80,255,.85)',earth:'rgba(180,120,40,.85)',
              poison:'rgba(80,220,50,.85)',rage:'rgba(255,50,10,.9)',vampire:'rgba(220,30,60,.85)',ghost:'rgba(190,215,255,.85)',titan:'rgba(200,145,65,.85)'};
    const ec2={lightning:'#fff580',fire:'#ff7700',ice:'#c0f0ff',shadow:'#cc55ff',earth:'#c09040',
               poison:'#60e030',rage:'#ff3010',vampire:'#dd2040',ghost:'#c8d8ff',titan:'#c89040'};
    ctx.save();ctx.strokeStyle=ec[this.element]||'rgba(255,240,60,.75)';ctx.lineWidth=2.2;
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a)*16,ey+Math.sin(a)*16);ctx.stroke();}
    ctx.globalAlpha=.38;ctx.fillStyle=ec2[this.element]||'#ffe060';ctx.beginPath();ctx.arc(ex,ey,9,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  _spurFx(cx,base){
    const f=this.facing,ex=cx+f*30,ey=base-18;
    const sc={lightning:'rgba(255,245,80,.75)',fire:'rgba(255,60,0,.75)',
              ice:'rgba(100,210,255,.75)',shadow:'rgba(200,60,255,.75)',earth:'rgba(160,100,20,.75)',
              poison:'rgba(70,210,40,.75)',rage:'rgba(255,45,5,.82)',vampire:'rgba(210,20,50,.75)',ghost:'rgba(180,210,255,.75)',titan:'rgba(190,135,55,.75)'};
    const sc2={lightning:'rgba(255,255,120,.3)',fire:'rgba(255,100,0,.3)',
               ice:'rgba(150,230,255,.3)',shadow:'rgba(180,50,255,.3)',earth:'rgba(140,90,15,.3)',
               poison:'rgba(60,200,30,.3)',rage:'rgba(255,50,0,.3)',vampire:'rgba(200,15,40,.3)',ghost:'rgba(180,205,255,.3)',titan:'rgba(175,120,45,.3)'};
    ctx.save();ctx.globalAlpha=.65;ctx.strokeStyle=sc[this.element]||'rgba(255,80,0,.75)';ctx.lineWidth=3;
    for(let i=0;i<7;i++){const a=(i/7)*Math.PI*2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a)*22,ey+Math.sin(a)*22);ctx.stroke();}
    ctx.globalAlpha=.28;ctx.fillStyle=sc2[this.element]||'rgba(255,119,0,.3)';ctx.beginPath();ctx.arc(ex,ey,14,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  _triggerSpecial(other){
    const f=this.facing,el=this.element;
    if(el==='lightning'){
      triggerUltAnn(this.ability.specialName,'#ffe840');
      // RAIO TRIPLO: 5 chained strikes + long stun
      for(let i=0;i<5;i++){
        if(other&&!other.dead){
          const dmg=Math.round(22*other.ability.defMult);
          other.hp=Math.max(0,other.hp-dmg);
          other.stunned=Math.max(other.stunned,70);other.hitTimer=Math.max(other.hitTimer,30);
          spawnP(other.x+other.w/2,other.y+20,12,58);

      shake(18);
    } else if(el==='fire'){
      triggerUltAnn(this.ability.specialName,'#ff6600');
      // EXPLOSÃO: screen-wide inferno
      if(other&&!other.dead){
        other.burning=400;
        const dmg=Math.round(45*other.ability.defMult);
        other.hp=Math.max(0,other.hp-dmg);other.hitTimer=40;
        other.vx=f*9*this.ability.kbMult;other.vy=-7;
        for(let i=0;i<40;i++)spawnP(other.x+other.w/2+rr(-60,60),other.y+rr(-20,20),1,20);

      triggerUltAnn(this.ability.specialName,'#cc44ff');

      for(let c=0;c<3;c++){
        if(other&&!other.dead){
          this.x=clamp(other.x+f*(c%2===0?-(other.w+10):(other.w+10)),0,W-this.w);

      triggerUltAnn(this.ability.specialName,'#c09040');
      // TERREMOTO TOTAL: massive AOE + debris

        const dmg=Math.round(70*other.ability.defMult);
        other.hp=Math.max(0,other.hp-dmg);other.hitTimer=70;

      }
      shake(10);

      this.hp=Math.min(this.maxHp,this.hp+25);

/* ── elemental aura & status overlays ───────────────────────────── */
function _drawElementAura(c,cx,gy,pl){
  const el=pl.element,now=Date.now();
  c.save();
  if(el==='lightning'){
    const g=c.createRadialGradient(cx,gy-40,0,cx,gy-40,40);
    g.addColorStop(0,'rgba(255,245,80,.15)');g.addColorStop(1,'transparent');
    c.fillStyle=g;c.beginPath();c.arc(cx,gy-40,40,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(255,245,80,.0)';c.lineWidth=1.5;c.lineCap='round';
    for(let i=0;i<4;i++){
      const phase=((now*.004+i*1.7)%Math.PI*2);
      const sx=cx+Math.cos(phase)*28,sy=gy-48+Math.sin(phase*.6)*16;
      const alpha=.35+Math.sin(now*.025+i)*.25;
      c.strokeStyle=`rgba(255,245,80,${alpha})`;
      c.beginPath();c.moveTo(sx,sy);
      c.lineTo(sx+Math.cos(phase+1.2)*10,sy+Math.sin(phase+1.2)*7);
      c.lineTo(sx+Math.cos(phase+2.4)*5,sy+Math.sin(phase+2.4)*10);c.stroke();

    c.globalAlpha=1;

    gf.addColorStop(0,'rgba(255,70,0,.12)');gf.addColorStop(1,'transparent');

  }
  if(el==='ice'){
    const gi=c.createRadialGradient(cx,gy-42,0,cx,gy-42,38);
    gi.addColorStop(0,'rgba(140,215,255,.10)');gi.addColorStop(1,'transparent');
    c.fillStyle=gi;c.beginPath();c.arc(cx,gy-42,38,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(160,225,255,.55)';c.lineWidth=1.3;
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2+now*.0009;
      const r=32+Math.sin(now*.0028+i)*4;
      const ix=cx+Math.cos(a)*r,iy=gy-48+Math.sin(a)*.38*r;
      c.beginPath();
      for(let j=0;j<3;j++){const ba=a+j*Math.PI*.667;c.moveTo(ix,iy);c.lineTo(ix+Math.cos(ba)*7,iy+Math.sin(ba)*7);}
      c.stroke();
    }
  }
  if(el==='shadow'){
    for(let i=0;i<3;i++){
      const phase=((now*.0014+i*.333)%1);
      const r=18+phase*32;
      c.strokeStyle=`rgba(185,70,255,${(1-phase)*.4})`;c.lineWidth=2;
      c.beginPath();c.arc(cx,gy-40,r,0,Math.PI*2);c.stroke();
    }
    const gs=c.createRadialGradient(cx,gy-40,0,cx,gy-40,35);
    gs.addColorStop(0,'rgba(110,0,200,.12)');gs.addColorStop(1,'transparent');
    c.fillStyle=gs;c.beginPath();c.arc(cx,gy-40,35,0,Math.PI*2);c.fill();
  }
  if(el==='earth'){
    for(let i=0;i<4;i++){
      const a=i/4*Math.PI*2+now*.0009;
      const r=30+Math.sin(now*.002+i)*5;
      const rx=cx+Math.cos(a)*r,ry=gy-44+Math.sin(a)*.42*r;
      c.fillStyle=`rgba(100,65,18,${.5+Math.sin(now*.003+i)*.2})`;
      c.save();c.translate(rx,ry);c.rotate(a+now*.001);
      c.beginPath();c.ellipse(0,0,4.5,3,0,0,Math.PI*2);c.fill();c.restore();
    }
  }
  if(el==='poison'){
    const gp=c.createRadialGradient(cx,gy-38,0,cx,gy-38,36);
    gp.addColorStop(0,'rgba(60,200,30,.14)');gp.addColorStop(1,'transparent');
    c.fillStyle=gp;c.beginPath();c.arc(cx,gy-38,36,0,Math.PI*2);c.fill();
    for(let i=0;i<5;i++){
      const t=((now*.005+i*.6)%1);
      const px2=cx+Math.sin(i*1.26+now*.002)*18,py2=gy-40-t*22;
      c.globalAlpha=(1-t)*.5;c.fillStyle=`hsl(${125+i*10},85%,${35+t*20}%)`;
      c.beginPath();c.arc(px2,py2,2.5*(1-t*.5),0,Math.PI*2);c.fill();
    }
    c.globalAlpha=1;
  }
  if(el==='rage'){
    const hpRatio=pl.hp/pl.maxHp,rage=1-hpRatio;
    const gr=c.createRadialGradient(cx,gy-38,0,cx,gy-38,38+rage*12);
    gr.addColorStop(0,`rgba(255,${Math.round(30+hpRatio*60)},0,${.08+rage*.22})`);
    gr.addColorStop(1,'transparent');
    c.fillStyle=gr;c.beginPath();c.arc(cx,gy-38,50,0,Math.PI*2);c.fill();
    if(rage>.4){
      for(let i=0;i<3;i++){
        const a=i/3*Math.PI*2+now*.02;
        const r2=28+rage*14+Math.sin(now*.018+i)*4;
        c.strokeStyle=`rgba(255,60,0,${rage*.45+Math.sin(now*.02+i)*.15})`;c.lineWidth=1.8;
        c.beginPath();c.arc(cx,gy-38,r2,a,a+Math.PI*.8);c.stroke();
      }
    }
  }
  if(el==='vampire'){
    const gv=c.createRadialGradient(cx,gy-40,0,cx,gy-40,34);
    gv.addColorStop(0,'rgba(180,0,30,.14)');gv.addColorStop(1,'transparent');
    c.fillStyle=gv;c.beginPath();c.arc(cx,gy-40,34,0,Math.PI*2);c.fill();
    for(let i=0;i<4;i++){
      const a=i/4*Math.PI*2-now*.01;
      const r2=28+Math.sin(now*.003+i)*5;
      const ox=cx+Math.cos(a)*r2,oy=gy-40+Math.sin(a)*.35*r2;
      c.fillStyle=`rgba(220,0,40,${.4+Math.sin(now*.008+i)*.2})`;
      c.beginPath();c.arc(ox,oy,3.5,0,Math.PI*2);c.fill();
    }
  }
  if(el==='ghost'){
    for(let i=0;i<4;i++){
      const phase=((now*.0012+i*.25)%1);
      const r2=14+phase*32;
      c.strokeStyle=`rgba(200,225,255,${(1-phase)*.45})`;c.lineWidth=1.8;
      c.beginPath();c.arc(cx,gy-40,r2,0,Math.PI*2);c.stroke();
    }
    const gg=c.createRadialGradient(cx,gy-40,0,cx,gy-40,32);
    gg.addColorStop(0,'rgba(180,210,255,.12)');gg.addColorStop(1,'transparent');
    c.fillStyle=gg;c.beginPath();c.arc(cx,gy-40,32,0,Math.PI*2);c.fill();
    if(pl.phaseFrames>0){
      const pa=(pl.phaseFrames/42)*.65;
      c.strokeStyle=`rgba(200,230,255,${pa})`;c.lineWidth=3;
      c.beginPath();c.arc(cx,gy-36,36,0,Math.PI*2);c.stroke();
    }
  }
  if(el==='titan'){
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2+now*.0007;
      const r2=34+Math.sin(now*.002+i)*6;
      const tx=cx+Math.cos(a)*r2,ty=gy-44+Math.sin(a)*.4*r2;
      c.fillStyle=`rgba(${110+i*8},${60+i*6},18,${.5+Math.sin(now*.003+i)*.2})`;
      c.save();c.translate(tx,ty);c.rotate(a+now*.0009);
      c.beginPath();c.ellipse(0,0,5.5,3.5,0,0,Math.PI*2);c.fill();c.restore();
    }
    const gt=c.createRadialGradient(cx,gy-38,0,cx,gy-38,40);
    gt.addColorStop(0,'rgba(140,80,20,.10)');gt.addColorStop(1,'transparent');
    c.fillStyle=gt;c.beginPath();c.arc(cx,gy-38,40,0,Math.PI*2);c.fill();
  }
  // status overlays
  c.globalAlpha=1;
  if(pl.burning>0){
    const ba=Math.min(.7,pl.burning/90);
    const bf=c.createRadialGradient(cx,gy-34,3,cx,gy-34,32);
    bf.addColorStop(0,`rgba(255,55,0,${ba})`);bf.addColorStop(1,'transparent');
    c.fillStyle=bf;c.beginPath();c.arc(cx,gy-34,32,0,Math.PI*2);c.fill();
  }
  if(pl.frozen>0){
    const fa=Math.min(.45,pl.frozen/110);
    c.strokeStyle=`rgba(110,220,255,${Math.min(.9,pl.frozen/50)})`;c.lineWidth=3;
    c.beginPath();c.arc(cx,gy-36,30,0,Math.PI*2);c.stroke();
    c.globalAlpha=fa;c.fillStyle='rgba(155,230,255,1)';
    c.beginPath();c.arc(cx,gy-36,30,0,Math.PI*2);c.fill();c.globalAlpha=1;
  }
  if(pl.stunned>0){
    for(let i=0;i<3;i++){
      const a=i/3*Math.PI*2+now*.018;
      c.fillStyle=`rgba(255,245,60,${.55+Math.sin(now*.022+i)*.3})`;
      c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillText('⚡',cx+Math.cos(a)*24,gy-76+Math.sin(a)*5);
    }
  }
  if(pl.poisoned>0){
    const po=Math.min(.55,pl.poisoned/90);
    const pov=c.createRadialGradient(cx,gy-36,4,cx,gy-36,30);
    pov.addColorStop(0,`rgba(60,200,30,${po})`);pov.addColorStop(1,'transparent');
    c.fillStyle=pov;c.beginPath();c.arc(cx,gy-36,30,0,Math.PI*2);c.fill();
  }
  c.restore();
}

/* ── sprite-based rooster drawing ───────────────────────────────── */
function _drawRooster(c,cx,gy,pl){
  const f=pl.facing;
  const now=Date.now();
  const bob=pl.state==='idle'?Math.sin(now*.004)*2.5:0;
  const sprite=SPRITES[pl.element];

  // animation offsets — sprite ground anchor is at (120,272) inside 240×300
  let dx=0,dy=bob,rot=0,sc=1;
  if(pl.state==='peck') {dx=f*12;dy+=6;}
  if(pl.state==='spur') {dy-=12;rot=-.08*f;}
  if(pl.state==='air')  {rot=-.14*f;}
  if(pl.state==='hurt') {dx=-f*16;rot=.24*f;}

  c.save();
  c.translate(cx+dx,gy+dy);
  if(rot!==0)c.rotate(rot);
  if(sprite&&sprite.complete&&sprite.naturalWidth>0){
    if(f===1){
      c.scale(.48,.48);
      c.drawImage(sprite,-120,-272);
    } else {
      c.scale(-.48,.48);
      c.drawImage(sprite,-120,-272);
    }
  }
  c.restore();

  // name tag
  if(!pl.hideTag){
    c.font='bold 12px Georgia';c.textAlign='center';
    c.fillStyle='rgba(0,0,0,.65)';c.fillRect(cx-32,gy-(pl.h||64)-24,64,18);
    c.fillStyle=hsl(pl.feathers,95,82);c.fillText(pl.name,cx,gy-(pl.h||64)-10);
  }
}

function _drawCrowd(c){
  for(let row=0;row<2;row++){
    const baseY=260+row*24,alpha=0.50-row*.1,sp=17+row*4;
    for(let x=60;x<W-40;x+=sp+Math.sin(x*.19)*2){
      if(x<225&&row===0)continue;
      const hy=baseY+Math.sin(x*.04)*4,sc=.82+row*.1;
      c.fillStyle=`rgba(12,6,2,${alpha})`;
      c.beginPath();c.ellipse(x,hy,5*sc,12*sc,0,0,Math.PI*2);c.fill();
      c.beginPath();c.arc(x+Math.sin(x*.22)*1.5,hy-14*sc,5.5*sc,0,Math.PI*2);c.fill();
      if((x+row*11)%43<7){
        c.beginPath();c.moveTo(x,hy-5*sc);
        c.lineTo(x+(((x|0)%2*2-1)*9*sc),hy-15*sc);
        c.strokeStyle=`rgba(12,6,2,${alpha})`;c.lineWidth=3*sc;c.stroke();
      }
    }
  }
}

function _drawFoot(c,ax,ay,f){
  c.strokeStyle=hsl(26,40,30);c.lineWidth=2.8;c.lineCap='round';
  for(const[dx,dy,sc]of[[f*13,3,.95],[f*9,-4,.85],[f*6,7,.75],[-f*7,2,.7]]){
    c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo(ax+dx*.5,ay+dy*.4+2,ax+dx*sc,ay+dy);c.stroke();
    c.fillStyle=hsl(24,30,40);c.beginPath();c.arc(ax+dx*sc,ay+dy,1.6,0,Math.PI*2);c.fill();
  }
}

/* ── FARM ARENA ──────────────────────────────────────────────────── */
let cloudOff=0;
function drawArena(){
  cloudOff+=.04;
  // sky
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#4a90d9');sg.addColorStop(.45,'#87ceeb');sg.addColorStop(.7,'#c8e8f0');sg.addColorStop(1,'#d4e8c0');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  // sun
  ctx.save();
  ctx.shadowColor='rgba(255,230,80,.6)';ctx.shadowBlur=40;
  ctx.fillStyle='#ffe840';ctx.beginPath();ctx.arc(W-120,95,38,0,Math.PI*2);ctx.fill();
  ctx.restore();
  const sunRays=ctx.createRadialGradient(W-120,95,38,W-120,95,130);
  sunRays.addColorStop(0,'rgba(255,240,100,.25)');sunRays.addColorStop(1,'rgba(255,230,80,0)');
  ctx.fillStyle=sunRays;ctx.beginPath();ctx.arc(W-120,95,130,0,Math.PI*2);ctx.fill();

  // clouds
  _drawCloud(ctx,150+Math.sin(cloudOff*.007)*12,110,55);
  _drawCloud(ctx,480+Math.sin(cloudOff*.005+1)*18,85,40);
  _drawCloud(ctx,760+Math.sin(cloudOff*.009+2)*10,130,48);

  // far hills
  ctx.fillStyle='#4a8a28';
  ctx.beginPath();ctx.moveTo(0,260);
  for(let x=0;x<=W;x+=40){ctx.lineTo(x,255+Math.sin(x*.018)*25+Math.cos(x*.011)*18);}
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3a7020';
  ctx.beginPath();ctx.moveTo(0,280);
  for(let x=0;x<=W;x+=50){ctx.lineTo(x,278+Math.sin(x*.022+1)*20+Math.cos(x*.014)*14);}
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // crowd spectators on the hills
  _drawCrowd(ctx);

  // warm arena atmosphere
  const atm=ctx.createRadialGradient(W/2,GROUND_Y-40,60,W/2,GROUND_Y+20,360);
  atm.addColorStop(0,'rgba(255,210,110,.10)');atm.addColorStop(.65,'rgba(255,160,60,.05)');atm.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=atm;ctx.fillRect(0,0,W,H);

  // barn (left background)
  _drawBarn(ctx,50,210);
  // trees (right background)
  _drawTree(ctx,740,305);
  _drawTree(ctx,810,295);
  _drawTree(ctx,870,310);

  // grass strip
  const gr=ctx.createLinearGradient(0,GROUND_Y-15,0,GROUND_Y+20);
  gr.addColorStop(0,'#5aaa28');gr.addColorStop(.5,'#4a9018');gr.addColorStop(1,'#3a7010');
  ctx.fillStyle=gr;ctx.fillRect(0,GROUND_Y-8,W,28);
  // grass blade texture
  ctx.strokeStyle='rgba(80,160,30,.5)';ctx.lineWidth=1.5;
  for(let x=8;x<W;x+=14){
    ctx.beginPath();ctx.moveTo(x,GROUND_Y+18);
    ctx.lineTo(x-3+Math.sin(x*.3)*4,GROUND_Y+2);ctx.stroke();
  }

  // dirt arena floor
  const dg=ctx.createLinearGradient(0,GROUND_Y+18,0,GROUND_Y+80);
  dg.addColorStop(0,'#c8823c');dg.addColorStop(.4,'#a05828');dg.addColorStop(1,'#783210');
  ctx.fillStyle=dg;ctx.fillRect(0,GROUND_Y+18,W,80);
  ctx.strokeStyle='rgba(60,20,0,.22)';ctx.lineWidth=1;
  for(let i=0;i<12;i++){const y=GROUND_Y+22+i*5;ctx.beginPath();ctx.moveTo(rr(0,20),y);ctx.lineTo(W-rr(0,20),y+rr(-1,1));ctx.stroke();}

  // arena center ellipse
  ctx.save();
  ctx.beginPath();ctx.ellipse(W/2,GROUND_Y+4,210,26,0,0,Math.PI*2);
  ctx.strokeStyle='rgba(220,170,80,.2)';ctx.lineWidth=2.5;ctx.stroke();
  ctx.restore();

  // fence
  _drawFence(ctx);

  // platforms as wooden boards
  for(let i=1;i<PLATFORMS.length;i++){
    const p=PLATFORMS[i];
    ctx.fillStyle='#7a4010';ctx.fillRect(p.x,p.y,p.w,p.h+6);
    ctx.fillStyle='#a06030';ctx.fillRect(p.x,p.y,p.w,5);
    ctx.strokeStyle='rgba(40,12,0,.35)';ctx.lineWidth=1;
    const step=Math.floor(p.w/4);
    for(let j=step;j<p.w;j+=step){ctx.beginPath();ctx.moveTo(p.x+j,p.y+1);ctx.lineTo(p.x+j,p.y+p.h+5);ctx.stroke();}
    ctx.strokeStyle='#4a2000';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h+6);
    // nail dots
    ctx.fillStyle='#5a3010';
    ctx.beginPath();ctx.arc(p.x+8,p.y+3,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(p.x+p.w-8,p.y+3,2,0,Math.PI*2);ctx.fill();
  }

  // hay bales (arena props)
  _drawHayBale(ctx,6,GROUND_Y-66);
  _drawHayBale(ctx,6,GROUND_Y-38);
  _drawHayBale(ctx,W-54,GROUND_Y-66);
  _drawHayBale(ctx,W-54,GROUND_Y-38);

  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,100,W/2,H/2,520);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function _drawCloud(c,cx,cy,s){
  c.save();c.fillStyle='rgba(255,255,255,.88)';
  c.beginPath();
  c.arc(cx,cy,s*.55,0,Math.PI*2);
  c.arc(cx+s*.55,cy-s*.08,s*.38,0,Math.PI*2);
  c.arc(cx-s*.4,cy-s*.04,s*.38,0,Math.PI*2);
  c.arc(cx+s*.95,cy+s*.05,s*.32,0,Math.PI*2);
  c.fill();
  c.restore();
}

function _drawBarn(c,bx,by){
  // body
  c.fillStyle='#8b2218';c.fillRect(bx,by,130,100);
  // siding lines
  c.strokeStyle='rgba(50,10,8,.4)';c.lineWidth=1;
  for(let y=by+8;y<by+100;y+=10){c.beginPath();c.moveTo(bx,y);c.lineTo(bx+130,y);c.stroke();}
  // roof
  c.fillStyle='#4a1008';
  c.beginPath();c.moveTo(bx-8,by);c.lineTo(bx+65,by-62);c.lineTo(bx+138,by);c.closePath();c.fill();
  c.strokeStyle='#3a0808';c.lineWidth=2;c.stroke();
  // door
  c.fillStyle='#2a0c00';c.fillRect(bx+50,by+50,30,50);
  c.strokeStyle='#4a2000';c.lineWidth=1;c.strokeRect(bx+50,by+50,30,50);
  // windows
  c.fillStyle='rgba(255,210,120,.3)';c.fillRect(bx+12,by+22,22,20);c.fillRect(bx+96,by+22,22,20);
  c.strokeStyle='#5a1a0a';c.lineWidth=1;c.strokeRect(bx+12,by+22,22,20);c.strokeRect(bx+96,by+22,22,20);
  // cross on windows
  c.beginPath();c.moveTo(bx+23,by+22);c.lineTo(bx+23,by+42);c.stroke();
  c.beginPath();c.moveTo(bx+12,by+32);c.lineTo(bx+34,by+32);c.stroke();
  c.beginPath();c.moveTo(bx+107,by+22);c.lineTo(bx+107,by+42);c.stroke();
  c.beginPath();c.moveTo(bx+96,by+32);c.lineTo(bx+118,by+32);c.stroke();
}

function _drawTree(c,tx,ty){
  // trunk
  c.fillStyle='#5a3010';c.fillRect(tx-5,ty-18,10,28);
  // canopy layers
  c.fillStyle='#1e5a0a';c.beginPath();c.arc(tx,ty-42,30,0,Math.PI*2);c.fill();
  c.fillStyle='#2a7014';c.beginPath();c.arc(tx-5,ty-52,24,0,Math.PI*2);c.fill();
  c.fillStyle='#38901e';c.beginPath();c.arc(tx+5,ty-60,18,0,Math.PI*2);c.fill();
}

function _drawFence(c){
  const fy=GROUND_Y+38;
  c.strokeStyle='#8b5a28';c.lineWidth=7;c.lineCap='square';
  c.beginPath();c.moveTo(0,fy);c.lineTo(W,fy);c.stroke();
  c.beginPath();c.moveTo(0,fy+20);c.lineTo(W,fy+20);c.stroke();
  c.lineWidth=9;
  for(let x=22;x<W;x+=58){
    c.beginPath();c.moveTo(x,fy-20);c.lineTo(x,fy+36);c.stroke();
    c.fillStyle='#9a6a38';c.beginPath();c.moveTo(x-5,fy-20);c.lineTo(x,fy-32);c.lineTo(x+5,fy-20);c.closePath();c.fill();
  }
}

function _drawHayBale(c,hx,hy){
  // bale body
  c.fillStyle='#c8a030';c.fillRect(hx,hy,48,28);
  // hay strands texture
  c.strokeStyle='rgba(90,55,8,.3)';c.lineWidth=1;
  for(let y=hy+6;y<hy+28;y+=5){c.beginPath();c.moveTo(hx+2,y);c.lineTo(hx+46,y+rr(-1,1));c.stroke();}
  for(let x=hx+8;x<hx+48;x+=8){c.beginPath();c.moveTo(x,hy+2);c.lineTo(x+rr(-1,1),hy+26);c.stroke();}
  // binding bands
  c.strokeStyle='rgba(140,75,15,.85)';c.lineWidth=2.2;
  c.strokeRect(hx,hy,48,28);
  c.beginPath();c.moveTo(hx+16,hy);c.lineTo(hx+16,hy+28);c.stroke();
  c.beginPath();c.moveTo(hx+32,hy);c.lineTo(hx+32,hy+28);c.stroke();
  // top highlight
  c.fillStyle='rgba(255,240,140,.28)';c.fillRect(hx+2,hy+2,44,5);
  // bottom shadow
  c.fillStyle='rgba(0,0,0,.22)';c.fillRect(hx,hy+24,48,4);
  c.fillStyle='rgba(0,0,0,.14)';c.fillRect(hx+2,hy+28,48,5);
}

/* ── HUD ─────────────────────────────────────────────────────────── */
function drawHUD(p1,p2,tl){
  const pg=ctx.createLinearGradient(0,0,0,HUD_H);
  pg.addColorStop(0,'rgba(4,1,8,.97)');pg.addColorStop(1,'rgba(8,3,14,.90)');
  ctx.fillStyle=pg;ctx.fillRect(0,0,W,HUD_H);
  const sep=ctx.createLinearGradient(0,0,W,0);
  sep.addColorStop(0,'transparent');sep.addColorStop(.2,'#6b3a00');
  sep.addColorStop(.5,'#c0820a');sep.addColorStop(.8,'#6b3a00');sep.addColorStop(1,'transparent');
  ctx.strokeStyle=sep;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,HUD_H);ctx.lineTo(W,HUD_H);ctx.stroke();
  _hudCorner(0,0,1);_hudCorner(W,0,-1);
  const bw=380,bh=22,by=10,pad=14;
  drawHPBar(pad,by,bw,bh,p1.hp/p1.maxHp,p1.feathers,'left',p1.name);
  drawHPBar(W-pad-bw,by,bw,bh,p2.hp/p2.maxHp,p2.feathers,'right',p2.name);
  const cy=by+bh+6;
  drawCDRow(p1,pad,cy,'left');drawCDRow(p2,W-pad-bw,cy,'right');
  drawTimer(tl);
}

function _hudCorner(cx,cy,dir){
  ctx.save();ctx.translate(cx,cy);ctx.scale(dir,1);
  ctx.strokeStyle='rgba(160,100,0,.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(2,2);ctx.lineTo(28,2);ctx.lineTo(2,22);ctx.stroke();
  ctx.restore();
}

function drawHPBar(x,y,w,h,ratio,hue,align,name){
  ctx.fillStyle='rgba(0,0,0,.7)';_roundRect(x-2,y-2,w+4,h+4,3);
  ctx.strokeStyle=`hsla(${hue},50%,25%,.8)`;ctx.lineWidth=1.5;_roundRect(x-2,y-2,w+4,h+4,3,true);
  ctx.fillStyle='#0e0600';_roundRect(x,y,w,h,2);
  const fw=w*Math.max(0,ratio);
  const fx=align==='right'?x+w-fw:x;
  if(fw>0){
    const fg=ctx.createLinearGradient(fx,y,fx+fw,y);
    if(ratio>.5){fg.addColorStop(0,`hsl(${hue},75%,30%)`);fg.addColorStop(.6,`hsl(${hue+15},82%,52%)`);fg.addColorStop(1,'#70ff90');}
    else if(ratio>.2){fg.addColorStop(0,'#804000');fg.addColorStop(1,'#ffa020');}
    else{fg.addColorStop(0,'#600000');fg.addColorStop(1,'#ff3000');}
    ctx.fillStyle=fg;ctx.fillRect(fx,y,fw,h);
    const sg2=ctx.createLinearGradient(0,y,0,y+h);
    sg2.addColorStop(0,'rgba(255,255,255,.18)');sg2.addColorStop(.5,'rgba(255,255,255,0)');
    ctx.fillStyle=sg2;ctx.fillRect(fx,y,fw,h/2);
  }
  ctx.font=`bold 14px "Bebas Neue",Impact,sans-serif`;ctx.textAlign=align==='left'?'left':'right';
  const tx=align==='left'?x+4:x+w-4;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText(name,tx+1,y+h-4);
  ctx.fillStyle=`hsl(${hue},90%,80%)`;ctx.fillText(name,tx,y+h-5);
  const hp=Math.ceil(ratio*100);
  ctx.font='11px monospace';ctx.textAlign=align==='left'?'right':'left';
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillText(hp,align==='left'?x+w-4:x+4,y+h-5);
}

function _roundRect(x,y,w,h,r,stroke=false){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();stroke?ctx.stroke():ctx.fill();
}

function drawCDRow(p,x,y,align){
  const bw=380,slotW=114,gap=9;
  const totalW=slotW*3+gap*2;
  const ax=align==='left'?x:x+bw-totalW;
  const labels=align==='left'
    ?{a:'F — BICADA',s:'G — ESPORÃO',sp:'H — '+( p.ability.specialCD?'ESPECIAL':'')}
    :{a:'↵ — BICADA',s:'⌫ — ESPORÃO',sp:'/ — '+( p.ability.specialCD?'ESPECIAL':'')};
  drawCDSlot(ax,              y,slotW,10,1-p.atkCD/p.ability.atkCD,    '#e8c000',labels.a);
  drawCDSlot(ax+slotW+gap,    y,slotW,10,1-p.spurCD/p.ability.spurCD,  '#e85000',labels.s);
  drawCDSlot(ax+slotW*2+gap*2,y,slotW,10,p.ability.specialCD?1-p.specialCD/p.ability.specialCD:1,'#9050ff',labels.sp);
}

function drawCDSlot(x,y,w,h,ratio,col,label){
  ctx.fillStyle='rgba(0,0,0,.5)';_roundRect(x,y,w,h,3);
  if(ratio>0){const r=clamp(ratio,0,1);ctx.fillStyle=r>=1?col:'rgba(100,50,0,.7)';_roundRect(x,y,w*r,h,3);}
  ctx.font=`10px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='center';
  ctx.fillStyle=ratio>=1?'rgba(255,240,160,.9)':'rgba(150,100,60,.7)';ctx.fillText(label,x+w/2,y+h-1);
}

function drawTimer(tl){
  const ts=Math.ceil(tl);const str=ts>0?String(ts):'FIM';
  const urgent=ts<=10&&ts>0;const cx=W/2,cy=HUD_H/2-2,d=26;
  ctx.save();
  if(urgent){ctx.shadowColor='#ff2200';ctx.shadowBlur=12+Math.sin(Date.now()*.01)*4;}
  ctx.fillStyle='rgba(0,0,0,.8)';
  ctx.beginPath();ctx.moveTo(cx,cy-d);ctx.lineTo(cx+d*.65,cy);ctx.lineTo(cx,cy+d);ctx.lineTo(cx-d*.65,cy);ctx.closePath();ctx.fill();
  ctx.strokeStyle=urgent?'#ff4400':'#8b6014';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
  ctx.font=`bold ${ts>99?22:28}px "Bebas Neue",Impact,sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=urgent?'#ff4444':'#ffe090';ctx.fillText(str,cx,cy+2);ctx.textBaseline='alphabetic';
  ctx.font='9px "Bebas Neue",Impact,sans-serif';ctx.fillStyle='rgba(160,100,30,.5)';ctx.textAlign='center';ctx.fillText('VS',cx,cy-d+11);
}

/* ── CHAR SELECT ─────────────────────────────────────────────────── */
const cs={p1Idx:0,p2Idx:1,p1OK:false,p2OK:false};
let csAnim=0;

function drawCharSelect(){
  csAnim+=.04;
  drawArena();
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);

  // title
  ctx.save();
  ctx.shadowColor='#e0a000';ctx.shadowBlur=20;
  ctx.font='bold 42px "Bebas Neue",Impact,sans-serif';ctx.textAlign='center';
  const tg=ctx.createLinearGradient(W/2-200,0,W/2+200,0);
  tg.addColorStop(0,'#e06000');tg.addColorStop(.5,'#ffd040');tg.addColorStop(1,'#e06000');
  ctx.fillStyle=tg;ctx.fillText('ESCOLHA SEU GALO',W/2,52);
  ctx.restore();

  // divider
  ctx.strokeStyle='rgba(180,140,60,.4)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(W/2,65);ctx.lineTo(W/2,H-20);ctx.stroke();

  _drawSelectPanel(40,   cs.p1Idx,cs.p1OK, 1,  'JOGADOR 1','W/A/D + W');
  _drawSelectPanel(W/2+10,cs.p2Idx,cs.p2OK,-1, 'JOGADOR 2','↑/←/→ + ↑');

  // process keys
  while(KQ.length){
    const k=KQ.shift();
    if(!cs.p1OK){
      if(k==='KeyA')cs.p1Idx=(cs.p1Idx+ROSTERS.length-1)%ROSTERS.length;
      if(k==='KeyD')cs.p1Idx=(cs.p1Idx+1)%ROSTERS.length;
      if(k==='KeyW')cs.p1OK=true;
    } else {
      if(k==='KeyA'||k==='KeyD')cs.p1OK=false;
    }
    if(!cs.p2OK){
      if(k==='ArrowLeft')cs.p2Idx=(cs.p2Idx+ROSTERS.length-1)%ROSTERS.length;
      if(k==='ArrowRight')cs.p2Idx=(cs.p2Idx+1)%ROSTERS.length;
      if(k==='ArrowUp')cs.p2OK=true;
    } else {
      if(k==='ArrowLeft'||k==='ArrowRight')cs.p2OK=false;
    }
    if(cs.p1OK&&cs.p2OK){
      startGame(ROSTERS[cs.p1Idx],ROSTERS[cs.p2Idx]);KQ.length=0;return;
    }
  }
}

function _drawSelectPanel(panelX,idx,confirmed,facing,playerLabel,ctrlHint){
  const r=ROSTERS[idx];
  const pw=W/2-20;
  const cx=panelX+pw/2;

  // panel header
  ctx.font=`bold 15px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='center';
  ctx.fillStyle=`hsl(${r.feathers},80%,65%)`;ctx.fillText(playerLabel,cx,75);
  ctx.font='11px monospace';ctx.fillStyle='rgba(180,160,120,.7)';ctx.fillText(ctrlHint,cx,90);

  // rooster name with arrows
  const nameY=122;
  ctx.font=`bold 30px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='center';
  ctx.fillStyle=`hsl(${r.feathers},85%,65%)`;ctx.fillText(r.name,cx,nameY);
  // navigation arrows
  ctx.font='bold 22px "Bebas Neue",Impact,sans-serif';
  ctx.fillStyle=confirmed?'rgba(100,80,50,.5)':'rgba(200,160,80,.9)';
  ctx.textAlign='left'; ctx.fillText('◀',panelX+6,nameY);
  ctx.textAlign='right';ctx.fillText('▶',panelX+pw-6,nameY);

  // ability name
  ctx.font=`bold 17px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='center';
  const abilCol=confirmed?'rgba(180,220,100,.8)':'rgba(255,200,80,.95)';
  ctx.fillStyle=abilCol;ctx.fillText('✦ '+r.abilityName,cx,144);

  // element badge
  const elLabel={lightning:'⚡ TROVÃO',fire:'🔥 FOGO',ice:'❄ GELO',shadow:'🌑 SOMBRA',earth:'🪨 TERRA',
                 poison:'☠ VENENO',rage:'💢 FÚRIA',vampire:'🩸 VAMPIRO',ghost:'👻 ESPECTRO',titan:'🏔 TITÃ'};
  const elCol={lightning:'rgba(255,245,80,1)',fire:'rgba(255,100,20,1)',ice:'rgba(130,220,255,1)',shadow:'rgba(200,80,255,1)',earth:'rgba(180,130,60,1)',
               poison:'rgba(80,220,60,1)',rage:'rgba(255,55,15,1)',vampire:'rgba(220,40,80,1)',ghost:'rgba(180,210,255,1)',titan:'rgba(200,150,80,1)'};
  ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillStyle=elCol[r.element]||'rgba(200,180,140,.9)';
  ctx.fillText(elLabel[r.element]||r.element,cx,158);

  // ability desc
  ctx.font='11px Georgia,serif';ctx.fillStyle='rgba(200,180,140,.85)';
  ctx.fillText(r.abilityDesc[0],cx,172);
  ctx.fillText(r.abilityDesc[1],cx,183);
  // special attack label
  ctx.font='bold 11px monospace';ctx.fillStyle='rgba(180,120,255,.95)';
  ctx.fillText('★ '+r.specialName,cx,196);
  ctx.font='10px Georgia,serif';ctx.fillStyle='rgba(160,110,220,.8)';
  ctx.fillText(r.specialDesc,cx,207);

  // stat bars
  const bx=panelX+38,bw=pw-76,bh=10;
  _statBar(bx,218,bw,bh,r.stats.vel,10,'#48c8ff','VEL');
  _statBar(bx,234,bw,bh,r.stats.atk,10,'#ff6040','ATK');
  _statBar(bx,250,bw,bh,r.stats.def,10,'#60e080','DEF');

  // rooster preview (scale 1.35 around foot point)
  const rgy=395, rcx=cx;
  ctx.save();
  ctx.translate(rcx,rgy);ctx.scale(1.35,1.35);ctx.translate(-rcx,-rgy);
  const mock={feathers:r.feathers,comb:r.comb,element:r.element,facing,state:'idle',
               animT:Date.now()*.015,wingFlap:0,h:64,name:r.name,hideTag:true,
               burning:0,frozen:0,stunned:0,poisoned:0,phaseFrames:0,hp:100,maxHp:100,
               ability:r.ability,frenesiTimer:0};
  _drawElementAura(ctx,rcx,rgy,mock);
  _drawRooster(ctx,rcx,rgy,mock);
  ctx.restore();

  // roster index dots
  const dotY=422,dotSpacing=18;
  const dotsX=cx-(ROSTERS.length-1)*dotSpacing/2;
  for(let i=0;i<ROSTERS.length;i++){
    ctx.beginPath();ctx.arc(dotsX+i*dotSpacing,dotY,i===idx?5:3,0,Math.PI*2);
    ctx.fillStyle=i===idx?`hsl(${ROSTERS[i].feathers},80%,65%)`:'rgba(150,120,80,.5)';ctx.fill();
  }

  // confirm status
  const confirmY=460;
  if(confirmed){
    const a=.6+Math.sin(csAnim)*0.4;
    ctx.font=`bold 19px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='center';
    ctx.fillStyle=`rgba(100,255,120,${a})`;ctx.fillText('✓ PRONTO!',cx,confirmY);
  } else {
    ctx.font=`bold 15px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='center';
    const pa=.5+Math.sin(csAnim+facing)*0.5;
    ctx.fillStyle=`rgba(220,200,120,${pa})`;
    ctx.fillText(facing===1?'W = CONFIRMAR':'↑ = CONFIRMAR',cx,confirmY);
  }
}

function _statBar(x,y,w,h,val,max,col,label){
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.beginPath();ctx.roundRect(x,y,w,h,3);ctx.fill();
  if(val>0){
    const fw=(val/max)*w;
    const g=ctx.createLinearGradient(x,y,x+fw,y);
    g.addColorStop(0,col+'88');g.addColorStop(1,col);
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,fw,h,3);ctx.fill();
  }
  ctx.font=`10px "Bebas Neue",Impact,sans-serif`;ctx.textAlign='right';
  ctx.fillStyle='rgba(200,180,130,.8)';ctx.fillText(label,x-4,y+h-1);
}

/* ── MENU ────────────────────────────────────────────────────────── */
let pulse=0;
function drawMenu(){
  drawArena();pulse+=.04;
  ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.shadowColor='#e03000';ctx.shadowBlur=30;
  ctx.font='bold 78px "Bebas Neue",Impact,serif';ctx.textAlign='center';
  const tg=ctx.createLinearGradient(W/2-240,0,W/2+240,0);
  tg.addColorStop(0,'#ff4400');tg.addColorStop(.5,'#ffd040');tg.addColorStop(1,'#ff4400');
  ctx.fillStyle=tg;ctx.fillText('RINHA DE GALO',W/2,190);ctx.restore();
  ctx.font='24px "Bebas Neue",Impact,serif';ctx.fillStyle='#b8946a';ctx.textAlign='center';
  ctx.fillText('2 JOGADORES — MESMO TECLADO',W/2,236);
  const a=.65+Math.sin(pulse)*.35;
  ctx.font='bold 20px "Bebas Neue",Impact,serif';ctx.fillStyle=`rgba(255,220,100,${a})`;
  ctx.fillText('PRESSIONE ENTER PARA COMEÇAR',W/2,350);
  _drawCtrlCard(ctx,120,400,true);_drawCtrlCard(ctx,W-370,400,false);
}

function _drawCtrlCard(c,x,y,isP1){
  const hue=isP1?8:45;const w=250,h=105;
  c.fillStyle='rgba(0,0,0,.6)';c.beginPath();c.roundRect(x,y,w,h,6);c.fill();
  c.strokeStyle=hsl(hue,60,40);c.lineWidth=1.5;c.beginPath();c.roundRect(x,y,w,h,6);c.stroke();
  c.font=`bold 17px "Bebas Neue",Impact,serif`;c.textAlign='left';
  c.fillStyle=hsl(hue,92,72);c.fillText(isP1?'JOGADOR 1':'JOGADOR 2',x+12,y+24);
  c.font='12px monospace';c.fillStyle='#c8c0b0';
  const lines=isP1
    ?['W / A / D  →  mover','F  →  bicada','G  →  esporão']
    :['↑ / ← / →  →  mover','Enter  →  bicada','Bksp  →  esporão'];
  lines.forEach((l,i)=>c.fillText(l,x+12,y+46+i*19));
}

/* ── GAME OVER ───────────────────────────────────────────────────── */
function drawGameOver(){
  drawArena();p1.draw();p2.draw();drawP();drawHUD(p1,p2,tLeft);
  ctx.fillStyle='rgba(0,0,0,.60)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.font='bold 64px "Bebas Neue",Impact,serif';
  ctx.save();ctx.shadowColor='#cc1000';ctx.shadowBlur=22;
  const wg=ctx.createLinearGradient(W/2-220,0,W/2+220,0);
  wg.addColorStop(0,'#ff2200');wg.addColorStop(.5,'#ffd030');wg.addColorStop(1,'#ff2200');
  ctx.fillStyle=wg;ctx.fillText(winner?`${winner.name} VENCEU!`:'EMPATE!',W/2,H/2-18);ctx.restore();
  pulse+=.04;
  const a=.55+Math.sin(pulse)*.45;
  ctx.font='bold 22px "Bebas Neue",Impact,serif';ctx.fillStyle=`rgba(255,210,100,${a})`;
  ctx.fillText('PRESSIONE ENTER PARA JOGAR NOVAMENTE',W/2,H/2+52);
}

/* ── GAME STATE ──────────────────────────────────────────────────── */
let p1,p2;
const RT=90;
let gState='menu',tLeft=RT,winner=null,lastT=0;

function startGame(r1,r2){
  const c1={left:'KeyA',right:'KeyD',jump:'KeyW',atk:'KeyF',spur:'KeyG',special:'KeyH'};
  const c2={left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',atk:'Enter',spur:'Backspace',special:'Slash'};
  p1=new Player({...r1,startX:200,  facing:1,  ctrl:c1});
  p2=new Player({...r2,startX:W-250,facing:-1, ctrl:c2});
  tLeft=RT;winner=null;PT.length=0;gState='playing';
  K['Enter']=K['NumpadEnter']=K['ArrowUp']=K['KeyW']=false;
}

function checkEnd(){
  if(p1.dead&&!p2.dead)     {winner=p2;gState='over';}
  else if(p2.dead&&!p1.dead){winner=p1;gState='over';}
  else if(p1.dead&&p2.dead) {winner=null;gState='over';}
  else if(tLeft<=0){winner=p1.hp>p2.hp?p1:p2.hp>p1.hp?p2:null;gState='over';}
}

/* ── MAIN LOOP ───────────────────────────────────────────────────── */
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  tickShake();

  if(gState==='menu'){
    drawMenu();
    if(K['Enter']||K['NumpadEnter']){
      K['Enter']=K['NumpadEnter']=false;KQ.length=0;
      cs.p1OK=false;cs.p2OK=false;gState='charSelect';
    }
  }
  else if(gState==='charSelect'){
    drawCharSelect();
  }
  else if(gState==='playing'){
    tLeft-=dt;p1.update(p2);p2.update(p1);tickP();checkEnd();
    ctx.save();ctx.translate(sx,sy);
    drawArena();p1.draw();p2.draw();drawP();drawHUD(p1,p2,tLeft);
    ctx.restore();
    drawUltAnn();
  }
  else if(gState==='over'){
    drawGameOver();
    if(K['Enter']||K['NumpadEnter']){
      K['Enter']=K['NumpadEnter']=false;KQ.length=0;pulse=0;
      cs.p1OK=false;cs.p2OK=false;gState='charSelect';
    }
  }
  requestAnimationFrame(loop);
}

document.fonts.ready.then(()=>
  requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);})
);
</script>
