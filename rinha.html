/* ── util ────────────────────────────────────────────────────────── */
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function hsl(h,s,l){return `hsl(${h},${s}%,${l}%)`;}
function rr(a,b){return Math.random()*(b-a)+a;}

/* sprites removed — Three.js 3D models used */
const SPRITES={};
/* ── particles ───────────────────────────────────────────────────── */
const PT=[];
function spawnP(x,y,n,hue){
  for(let i=0;i<n;i++){
    const a=rr(0,Math.PI*2),s=rr(1.5,6);
    PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,dec:rr(.04,.09),hue,sz:rr(2.5,5.5)});
  }
}
function tickP(){
  for(let i=PT.length-1;i>=0;i--){
    const p=PT[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=p.dec;
    if(p.life<=0)PT.splice(i,1);
  }
}
function drawP(){
  for(const p of PT){
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=hsl(p.hue,82,62);
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

/* ── screen shake ─────────────────────────────────────────────────── */
let sx=0,sy=0,sm=0;
function shake(m){sm=Math.max(sm,m);}
function tickShake(){if(sm>.2){sx=rr(-sm,sm);sy=rr(-sm,sm);sm*=.7;}else sx=sy=sm=0;}
let ultAnn='',ultAnnT=0,ultAnnCol='#fff',ultFlash=0;
function triggerUltAnn(name,col){ultAnn=name;ultAnnT=130;ultAnnCol=col||'#fff';ultFlash=18;}
function drawUltAnn(){
  if(ultFlash>0){
    ctx.save();ctx.globalAlpha=Math.min(.55,ultFlash/18*.55);
    ctx.fillStyle=ultAnnCol;ctx.fillRect(0,0,W,H);
    ctx.restore();ultFlash--;
  }
  if(ultAnnT>0){
    const a=ultAnnT>110?((130-ultAnnT)/20):(ultAnnT/30);
    ctx.save();ctx.globalAlpha=Math.min(1,a);ctx.textAlign='center';
    ctx.font='bold 42px Georgia';
    ctx.shadowColor=ultAnnCol;ctx.shadowBlur=28;
    ctx.fillStyle=ultAnnCol;
    ctx.fillText('★ '+ultAnn+' ★',W/2,H/2-24);
    ctx.shadowBlur=0;ctx.font='bold 18px Georgia';ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText('ULT ESPECIAL',W/2,H/2+8);
    ctx.restore();ultAnnT--;
  }
}

/* ── input ───────────────────────────────────────────────────────── */
const K={};
const KQ=[];
window.addEventListener('keydown',e=>{K[e.code]=true;KQ.push(e.code);e.preventDefault();});
window.addEventListener('keyup',  e=>{K[e.code]=false;});
// tap anywhere on canvas = Enter (menu/charSelect navigation on mobile)
document.getElementById('gl3').addEventListener('touchstart',e=>{
  if(gState==='menu'||gState==='over'){tbPress('Enter',true);setTimeout(()=>tbPress('Enter',false),80);}
  else if(gState==='charSelect'){
    // single tap confirms both players on mobile solo
    if(!cs.p1OK){tbPress('KeyW',true);setTimeout(()=>tbPress('KeyW',false),80);}
    else if(!cs.p2OK){tbPress('ArrowUp',true);setTimeout(()=>tbPress('ArrowUp',false),80);}
  }
},{passive:true});

function tbPress(code,down){K[code]=down;if(down)KQ.push(code);}
(()=>{
  const map={p1l:'KeyA',p1r:'KeyD',p1j:'KeyW',p1a:'KeyF',p1s:'KeyG',p1x:'KeyH',
             p2l:'ArrowLeft',p2r:'ArrowRight',p2j:'ArrowUp',p2a:'Enter',p2s:'Backspace',p2x:'Slash'};
  for(const[id,code]of Object.entries(map)){
    const el=document.getElementById(id);if(!el)continue;
    const on=()=>tbPress(code,true),off=()=>tbPress(code,false);
    el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
    el.addEventListener('touchend',  e=>{e.preventDefault();off();},{passive:false});
    el.addEventListener('touchcancel',off);
    el.addEventListener('mousedown',on);
    el.addEventListener('mouseup',off);
    el.addEventListener('mouseleave',off);
  }
})();

/* ── hit-test ────────────────────────────────────────────────────── */
function rectsOvlp(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}

/* ── Player ──────────────────────────────────────────────────────── */
class Player{
  constructor(c){
    Object.assign(this,{
      name:c.name,startX:c.startX,x:c.startX,y:GROUND_Y-64,
      vx:0,vy:0,w:52,h:64,facing:c.facing,ctrl:c.ctrl,
      feathers:c.feathers,comb:c.comb,element:c.element,
      maxHp:100,hp:100,grounded:false,canJump:false,jumpCount:0,
      atkCD:0,spurCD:0,atkTimer:0,spurTimer:0,hitTimer:0,
      dead:false,deathAnim:0,animT:0,wingFlap:0,state:'idle',
      ability:c.ability,
      burning:0,frozen:0,stunned:0,poisoned:0,phaseFrames:0,
      specialCD:0,frenesiTimer:0,slamming:false,
    });
  }
  reset(){
    this.x=this.startX;this.y=GROUND_Y-64;
    this.vx=this.vy=0;this.hp=this.maxHp;this.grounded=false;
    this.atkCD=this.spurCD=this.atkTimer=this.spurTimer=this.hitTimer=0;
    this.dead=false;this.deathAnim=0;this.state='idle';this.jumpCount=0;
    this.burning=this.frozen=this.stunned=this.poisoned=this.phaseFrames=0;
    this.specialCD=this.frenesiTimer=0;this.slamming=false;
  }
  update(other){
    if(this.dead){this.deathAnim=Math.min(this.deathAnim+.05,1);return;}
    if(this.atkCD>0)this.atkCD--;
    if(this.spurCD>0)this.spurCD--;
    if(this.hitTimer>0)this.hitTimer--;
    if(this.atkTimer>0)this.atkTimer--;
    if(this.spurTimer>0)this.spurTimer--;

    // tick status effects
    if(this.burning>0){
      this.burning--;
      if(this.burning%8===0){this.hp=Math.max(0,this.hp-.9);spawnP(this.x+this.w/2,this.y+30,2,15);}
      if(this.hp<=0)this.dead=true;
    }
    if(this.frozen>0)this.frozen--;
    if(this.stunned>0)this.stunned--;
    if(this.poisoned>0){
      this.poisoned--;
      if(this.poisoned%10===0){this.hp=Math.max(0,this.hp-.65);spawnP(this.x+this.w/2,this.y+30,2,130);}
      if(this.hp<=0)this.dead=true;
    }
    if(this.phaseFrames>0)this.phaseFrames--;

    const L=K[this.ctrl.left],R=K[this.ctrl.right],
          J=K[this.ctrl.jump],A=K[this.ctrl.atk],S=K[this.ctrl.spur],SP=K[this.ctrl.special];
    if(this.specialCD>0)this.specialCD--;
    if(this.frenesiTimer>0)this.frenesiTimer--;
    const frozenMult=this.frozen>0?0.32:1;
    const stunnedBlock=this.stunned>0;
    const frenesi=this.element==='rage'&&this.frenesiTimer>0;
    const rageBoost=this.element==='rage'?(frenesi?2.5:1+(1-this.hp/this.maxHp)*1.8):1;
    const rageSpd=this.element==='rage'?(frenesi?2.2:1+(1-this.hp/this.maxHp)*.6):1;
    const spd=this.ability.speed*frozenMult*rageSpd;

    if(!L&&!R&&other)this.facing=other.x>this.x?1:-1;
    if(L){this.vx=-spd;this.facing=-1;}
    else if(R){this.vx=spd;this.facing=1;}
    else{this.vx*=.72;}

    if(J&&this.canJump&&!stunnedBlock){
      if(this.grounded){

    if(pl.phaseFrames>0){
      const pa=(pl.phaseFrames/42)*.65;
      c.strokeStyle=`rgba(200,230,255,${pa})`;c.lineWidth=3;
      c.beginPath();c.arc(cx,gy-36,36,0,Math.PI*2);c.stroke();
    }
  }
  if(el==='titan'){
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2+now*.0007;
      const r2=34+Math.sin(now*.002+i)*6;
      const tx=cx+Math.cos(a)*r2,ty=gy-44+Math.sin(a)*.4*r2;
      c.fillStyle=`rgba(${110+i*8},${60+i*6},18,${.5+Math.sin(now*.003+i)*.2})`;
      c.save();c.translate(tx,ty);c.rotate(a+now*.0009);
      c.beginPath();c.ellipse(0,0,5.5,3.5,0,0,Math.PI*2);c.fill();c.restore();
    }
    const gt=c.createRadialGradient(cx,gy-38,0,cx,gy-38,40);
    gt.addColorStop(0,'rgba(140,80,20,.10)');gt.addColorStop(1,'transparent');
    c.fillStyle=gt;c.beginPath();c.arc(cx,gy-38,40,0,Math.PI*2);c.fill();
  }
  // status overlays
  c.globalAlpha=1;
  if(pl.burning>0){
    const ba=Math.min(.7,pl.burning/90);
    const bf=c.createRadialGradient(cx,gy-34,3,cx,gy-34,32);
    bf.addColorStop(0,`rgba(255,55,0,${ba})`);bf.addColorStop(1,'transparent');
    c.fillStyle=bf;c.beginPath();c.arc(cx,gy-34,32,0,Math.PI*2);c.fill();
  }
  if(pl.frozen>0){
    const fa=Math.min(.45,pl.frozen/110);
    c.strokeStyle=`rgba(110,220,255,${Math.min(.9,pl.frozen/50)})`;c.lineWidth=3;
    c.beginPath();c.arc(cx,gy-36,30,0,Math.PI*2);c.stroke();
    c.globalAlpha=fa;c.fillStyle='rgba(155,230,255,1)';
    c.beginPath();c.arc(cx,gy-36,30,0,Math.PI*2);c.fill();c.globalAlpha=1;
  }
  if(pl.stunned>0){
    for(let i=0;i<3;i++){
      const a=i/3*Math.PI*2+now*.018;
      c.fillStyle=`rgba(255,245,60,${.55+Math.sin(now*.022+i)*.3})`;
      c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillText('⚡',cx+Math.cos(a)*24,gy-76+Math.sin(a)*5);
    }
  }
  if(pl.poisoned>0){
    const po=Math.min(.55,pl.poisoned/90);
    const pov=c.createRadialGradient(cx,gy-36,4,cx,gy-36,30);
    pov.addColorStop(0,`rgba(60,200,30,${po})`);pov.addColorStop(1,'transparent');
    c.fillStyle=pov;c.beginPath();c.arc(cx,gy-36,30,0,Math.PI*2);c.fill();
  }
  c.restore();
}

/* ── 2D rooster — all states, char-select + gameplay ─────────────── */
function _draw2DRooster(c,cx,cy,featherHue,facing,scale,state,t,isHit){
  const s=scale||1,f=facing||1;
  t=t||0; state=state||'idle';
  let bY=0,bTilt=0,nTilt=-0.18,hTilt=0,lLA=0,rLA=0,wS=0,tailS=0;
  if(state==='idle'){
    bY=Math.sin(t*4.2)*2.5; nTilt=-0.18+Math.sin(t*2.8)*0.05;
    tailS=Math.sin(t*2.5)*0.06;
  }else if(state==='peck'){
    bTilt=-0.22;nTilt=0.3;hTilt=0.18;lLA=0.32;bY=4;
  }else if(state==='spur'){
    bY=-10;bTilt=0.12;lLA=-0.72;rLA=0.42;wS=0.85;
  }else if(state==='air'){
    bTilt=-0.22;wS=1.1;lLA=0.45;rLA=0.45;bY=-6;
  }else if(state==='hurt'){
    bTilt=0.42;bY=-4;nTilt=0.32;hTilt=0.28;
  }else if(state==='walk'){
    const sw=Math.sin(t*10)*0.38; lLA=sw;rLA=-sw;bY=-Math.abs(Math.sin(t*10))*3;
  }else if(state==='dead'){
    bTilt=1.4;bY=-10;nTilt=0.5;
  }
  const H=featherHue;
  const cDark =isHit?'hsl('+H+',40%,70%)':'hsl('+H+',72%,28%)';
  const cMid  =isHit?'hsl('+H+',46%,80%)':'hsl('+H+',74%,46%)';
  const cLight=isHit?'hsl('+H+',52%,90%)':'hsl('+H+',80%,66%)';
  const outl  ='rgba(0,0,0,0.78)';
  const combC =isHit?'#ffaaaa':'hsl('+((H+170)%360)+',92%,52%)';
  const combO =isHit?'#993333':'hsl('+((H+170)%360)+',80%,28%)';
  const skinC ='hsl('+H+',55%,40%)';
  function sf(fill,stroke,lw){c.fillStyle=fill;c.fill();c.strokeStyle=stroke;c.lineWidth=lw||1.5;c.stroke();}
  c.save();
  c.translate(cx,cy);c.scale(f*s,s);c.translate(0,bY);c.rotate(bTilt);
  c.lineCap='round';c.lineJoin='round';
  // shadow
  c.save();c.rotate(-bTilt);c.translate(0,-bY);
  c.fillStyle='rgba(0,0,0,0.22)';
  c.beginPath();c.ellipse(0,6,27,9,0,0,Math.PI*2);c.fill();
  c.restore();
  // tail feathers
  c.save();
  for(let i=0;i<8;i++){
    const a=-2.6+i*0.76+tailS,len=30+Math.abs(i-3.5)*8;
    c.beginPath();c.moveTo(-14,-22);
    c.lineTo(-14+Math.cos(a)*len,-22+Math.sin(a)*len);
    c.lineTo(-14+Math.cos(a+0.26)*len,-22+Math.sin(a+0.26)*len);
    c.closePath();
    sf(i%2===0?cDark:cMid,outl,1);
  }
  c.restore();
  // body dark base
  c.beginPath();c.ellipse(0,-28,21,25,-0.18,0,Math.PI*2);
  sf(cDark,outl,2);
  // body mid layer
  c.beginPath();c.ellipse(2,-30,15,19,-0.12,0,Math.PI*2);
  c.fillStyle=cMid;c.fill();
  // belly highlight
  c.beginPath();c.ellipse(6,-33,9,12,-0.08,0,Math.PI*2);
  c.fillStyle=cLight;c.fill();
  // feather texture on body
  c.strokeStyle=outl;c.lineWidth=0.8;
  for(let i=0;i<5;i++){const fx=-5+i*3.5,fy=-45+i*2.5;c.beginPath();c.moveTo(fx,fy);c.lineTo(fx-4,fy+9);c.stroke();}
  // wing
  c.save();c.rotate(-wS*0.44);
  c.beginPath();c.ellipse(2,-31,15+wS*9,17,-0.3+wS*0.6,0,Math.PI*2);
  sf(cMid,outl,1.5);
  // wing feather lines
  c.strokeStyle=outl;c.lineWidth=0.75;
  for(let i=0;i<4;i++){const wx=5+i*3,wy=-42+i*4;c.beginPath();c.moveTo(wx,wy);c.lineTo(wx+5,wy+11);c.stroke();}
  c.restore();
  // left leg
  c.save();c.rotate(lLA);
  c.strokeStyle=outl;c.lineWidth=6;c.beginPath();c.moveTo(-3,-10);c.lineTo(-5,8);c.stroke();
  c.strokeStyle=skinC;c.lineWidth=4;c.beginPath();c.moveTo(-3,-10);c.lineTo(-5,8);c.stroke();
  c.strokeStyle=outl;c.lineWidth=3.5;
  c.beginPath();c.moveTo(-5,8);c.lineTo(-15,13);c.stroke();
  c.beginPath();c.moveTo(-5,8);c.lineTo(3,13);c.stroke();
  c.beginPath();c.moveTo(-5,8);c.lineTo(-5,15);c.stroke();
  c.strokeStyle=skinC;c.lineWidth=2.2;
  c.beginPath();c.moveTo(-5,8);c.lineTo(-15,13);c.stroke();
  c.beginPath();c.moveTo(-5,8);c.lineTo(3,13);c.stroke();
  c.beginPath();c.moveTo(-5,8);c.lineTo(-5,15);c.stroke();
  c.restore();
  // right leg
  c.save();c.rotate(rLA);
  c.strokeStyle=outl;c.lineWidth=6;c.beginPath();c.moveTo(6,-10);c.lineTo(8,8);c.stroke();
  c.strokeStyle=skinC;c.lineWidth=4;c.beginPath();c.moveTo(6,-10);c.lineTo(8,8);c.stroke();
  c.strokeStyle=outl;c.lineWidth=3.5;
  c.beginPath();c.moveTo(8,8);c.lineTo(-1,13);c.stroke();
  c.beginPath();c.moveTo(8,8);c.lineTo(17,13);c.stroke();
  c.beginPath();c.moveTo(8,8);c.lineTo(8,15);c.stroke();
  c.strokeStyle=skinC;c.lineWidth=2.2;
  c.beginPath();c.moveTo(8,8);c.lineTo(-1,13);c.stroke();
  c.beginPath();c.moveTo(8,8);c.lineTo(17,13);c.stroke();
  c.beginPath();c.moveTo(8,8);c.lineTo(8,15);c.stroke();
  c.restore();
  // neck
  c.save();c.translate(10,-47);c.rotate(nTilt+0.18);
  c.beginPath();c.ellipse(0,0,8,17,0,0,Math.PI*2);
  sf(cMid,outl,1.5);
  // neck feather lines
  c.strokeStyle=outl;c.lineWidth=0.75;
  c.beginPath();c.moveTo(-4,-9);c.lineTo(-6,1);c.stroke();
  c.beginPath();c.moveTo(2,-11);c.lineTo(0,1);c.stroke();
  // head
  c.translate(0,-19);c.rotate(hTilt);
  c.beginPath();c.arc(2,0,14,0,Math.PI*2);
  sf(cMid,outl,2);
  // head highlight
  c.beginPath();c.arc(-2,-5,6,0,Math.PI*2);
  c.fillStyle=cLight;c.fill();
  if(state==='dead'){
    c.strokeStyle='#222';c.lineWidth=2.8;c.lineCap='round';
    c.beginPath();c.moveTo(5,-6);c.lineTo(14,2);c.stroke();
    c.beginPath();c.moveTo(14,-6);c.lineTo(5,2);c.stroke();
  }else{
    // eye sclera
    c.beginPath();c.arc(11,-2,5.5,0,Math.PI*2);
    c.fillStyle='#fffff0';c.fill();c.strokeStyle=outl;c.lineWidth=1.2;c.stroke();
    // iris
    c.beginPath();c.arc(11,-2,3.5,0,Math.PI*2);
    c.fillStyle='hsl('+((H+200)%360)+',55%,30%)';c.fill();
    // pupil
    c.beginPath();c.arc(12,-2.5,2,0,Math.PI*2);
    c.fillStyle='#0a0a0a';c.fill();
    // catchlight
    c.beginPath();c.arc(13,-3.5,1,0,Math.PI*2);
    c.fillStyle='rgba(255,255,255,0.9)';c.fill();
  }
  // comb — 3 lobes
  c.beginPath();c.ellipse(0,-15,5.5,9,0.14,0,Math.PI*2);sf(combC,combO,1.3);
  c.beginPath();c.ellipse(6,-19,4.5,7.5,0,0,Math.PI*2);sf(combC,combO,1.3);
  c.beginPath();c.ellipse(11,-15,3.8,6,-0.14,0,Math.PI*2);sf(combC,combO,1.3);
  // wattle
  c.beginPath();c.ellipse(8,-3,4.5,7,0.1,0,Math.PI*2);sf(combC,combO,1.1);
  // beak
  c.beginPath();c.moveTo(14,0);c.lineTo(30,-5);c.lineTo(30,6);c.closePath();
  sf(isHit?'#c8c850':'#d4c428',outl,1.4);
  c.restore();c.restore();
}

/* ── rooster draw: 2D for all cases ─────────────────────────────── */
function _drawRooster(c,cx,gy,pl){
  const isPreview=(pl!==p1&&pl!==p2);
  const scale=isPreview?1.35:0.82;
  const t=Date.now()*0.001;
  const isHit=pl.hitTimer>0&&Math.floor(pl.hitTimer/3)%2===0;
  _draw2DRooster(c,cx,gy,pl.feathers,pl.facing,scale,pl.state,t,isHit);
  if(!pl.hideTag){
    c.font='bold 12px Georgia';c.textAlign='center';
    const ty=gy-(pl.h||64);
    c.fillStyle='rgba(0,0,0,.65)';c.fillRect(cx-32,ty-18,64,16);
    c.fillStyle='hsl('+pl.feathers+',95%,82%)';c.fillText(pl.name,cx,ty-6);
  }
}

function _drawCrowd(c,now){
  const cols=['#d42020','#1a50d4','#18b030','#d09010','#b018c8','#10c4b8','#d05018','#d4d010','#c81850','#18a0d0'];
  for(let row=0;row<3;row++){
    const baseY=248+row*20,alpha=.72-row*.14,sp=14+row*3;
    for(let x=55;x<W-35;x+=sp+Math.sin(x*.19)*2){
      if(x<230&&row===0)continue;
      const hy=baseY+Math.sin(x*.04)*4,sc=.78+row*.08;
      const wave=Math.sin(now*.002+x*.07)*2.5*(1-row*.2);
      const ci=(Math.floor(x/22)+row*4)%cols.length;
      const col=cols[ci];
      const r=parseInt(col.slice(1,3),16),g=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
      // body
      c.fillStyle=`rgba(${r},${g},${b},${alpha})`;
      c.beginPath();c.ellipse(x,hy+wave*.2,4.5*sc,11*sc,0,0,Math.PI*2);c.fill();
      // head
      c.fillStyle=`rgba(200,155,100,${alpha})`;
      c.beginPath();c.arc(x+Math.sin(x*.22)*.8,hy-13*sc+wave*.4,4.8*sc,0,Math.PI*2);c.fill();
      // waving arm
      if((x+row*9)%32<12){
        const armDir=((x|0)%2*2-1);
        c.beginPath();c.moveTo(x,hy-4*sc);
        c.lineTo(x+armDir*9*sc,hy-14*sc+wave*2.5);
        c.strokeStyle=`rgba(${r},${g},${b},${alpha*.85})`;c.lineWidth=2.8*sc;c.stroke();
      }
    }
  }
}

function _drawTorch(c,tx,ty,now){
  c.fillStyle='#4a2a0e';c.fillRect(tx-3,ty,6,16);
  c.fillStyle='#2e1408';c.fillRect(tx-4,ty+12,8,5);
  const flicker=Math.sin(now*.0091)*1.8;
  for(let i=0;i<6;i++){
    const t=((now*.003*.7+i/6)%1);
    const fy2=ty-3-t*14;
    const fr=3.8*(1-t*.65)+Math.sin(now*.009+i*1.3)*.7;
    c.globalAlpha=(1-t)*.75;
    c.fillStyle=t<.35?'#ff5500':'#ffcc20';
    c.beginPath();c.arc(tx+flicker*.4,fy2,fr,0,Math.PI*2);c.fill();
  }
  c.globalAlpha=1;
  const tg=c.createRadialGradient(tx,ty-6,0,tx,ty-6,26);
  tg.addColorStop(0,'rgba(255,110,15,.28)');tg.addColorStop(1,'transparent');
  c.fillStyle=tg;c.beginPath();c.arc(tx,ty-6,26,0,Math.PI*2);c.fill();
}

function _drawFoot(c,ax,ay,f){
  c.strokeStyle=hsl(26,40,30);c.lineWidth=2.8;c.lineCap='round';
  for(const[dx,dy,sc]of[[f*13,3,.95],[f*9,-4,.85],[f*6,7,.75],[-f*7,2,.7]]){
    c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo(ax+dx*.5,ay+dy*.4+2,ax+dx*sc,ay+dy);c.stroke();
    c.fillStyle=hsl(24,30,40);c.beginPath();c.arc(ax+dx*sc,ay+dy,1.6,0,Math.PI*2);c.fill();
  }
}

/* ── ARENA — Three.js renders the scene, ctx is transparent overlay ── */
function drawArena(){
  ctx.clearRect(0,0,W,H);
  // Draw elevated platforms (skip ground platform at index 0)
  const plats=PLATFORMS.slice(1);
  for(const p of plats){
    const g=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    g.addColorStop(0,'#c8922a');g.addColorStop(0.4,'#a8721a');g.addColorStop(1,'#7a5010');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,4);ctx.fill();
    ctx.strokeStyle='#3c2008';ctx.lineWidth=2;ctx.stroke();
    // wood grain lines
    ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=1;
    for(let gx=p.x+20;gx<p.x+p.w-10;gx+=22){
      ctx.beginPath();ctx.moveTo(gx,p.y+2);ctx.lineTo(gx+4,p.y+p.h-2);ctx.stroke();
    }
    // top highlight
    ctx.strokeStyle='rgba(255,220,120,0.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(p.x+4,p.y+1);ctx.lineTo(p.x+p.w-4,p.y+1);ctx.stroke();
  }
}

/* ── HUD ─────────────────────────────────────────────────────────── */
function drawHUD(p1,p2,tl){
  // base panel
  const pg=ctx.createLinearGradient(0,0,0,HUD_H);
  pg.addColorStop(0,'rgba(2,0,5,.99)');pg.addColorStop(.55,'rgba(5,1,10,.96)');pg.addColorStop(1,'rgba(8,2,14,.88)');
  ctx.fillStyle=pg;ctx.fillRect(0,0,W,HUD_H);

  // element tint on sides
  const p1g=ctx.createLinearGradient(0,0,220,HUD_H);
  p1g.addColorStop(0,`hsla(${p1.feathers},70%,14%,.65)`);p1g.addColorStop(1,'transparent');
  ctx.fillStyle=p1g;ctx.fillRect(0,0,220,HUD_H);
  const p2g=ctx.createLinearGradient(W,0,W-220,HUD_H);
  p2g.addColorStop(0,`hsla(${p2.feathers},70%,14%,.65)`);p2g.addColorStop(1,'transparent');
  ctx.fillStyle=p2g;ctx.fillRect(W-220,0,220,HUD_H);

  // bottom separator with glow
  const sep=ctx.createLinearGradient(0,0,W,0);
  sep.addColorStop(0,'transparent');sep.addColorStop(.08,`hsla(${p1.feathers},75%,38%,.55)`);
  sep.addColorStop(.5,'#d09812');sep.addColorStop(.92,`hsla(${p2.feathers},75%,38%,.55)`);sep.addColorStop(1,'transparent');
  ctx.save();ctx.shadowColor='rgba(200,140,10,.3)';ctx.shadowBlur=6;
  ctx.strokeStyle=sep;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,HUD_H);ctx.lineTo(W,HUD_H);ctx.stroke();
  ctx.restore();

  _hudCorner(0,0,1,p1.feathers);_hudCorner(W,0,-1,p2.feathers);
  const bw=388,bh=24,by=9,pad=13;
  drawHPBar(pad,by,bw,bh,p1.hp/p1.maxHp,p1.feathers,'left',p1.name);
  drawHPBar(W-pad-bw,by,bw,bh,p2.hp/p2.maxHp,p2.feathers,'right',p2.name);
  const cy=by+bh+7;
  drawCDRow(p1,pad,cy,'left');drawCDRow(p2,W-pad-bw,cy,'right');
  drawTimer(tl);
}

function _hudCorner(cx,cy,dir,hue){
  ctx.save();ctx.translate(cx,cy);ctx.scale(dir,1);
  ctx.strokeStyle=`hsla(${hue},68%,42%,.75)`;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(3,3);ctx.lineTo(40,3);ctx.moveTo(3,3);ctx.lineTo(3,30);ctx.stroke();
  ctx.strokeStyle=`hsla(${hue},78%,60%,.35)`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(25,5);ctx.moveTo(5,5);ctx.lineTo(5,20);ctx.stroke();
  ctx.restore();
}

function drawHPBar(x,y,w,h,ratio,hue,align,name){
  // outer shadow
  ctx.fillStyle='rgba(0,0,0,.8)';_roundRect(x-2,y-2,w+4,h+4,4);
  // track
  ctx.fillStyle='#060204';_roundRect(x,y,w,h,3);
  const fw=w*Math.max(0,ratio);
  const fx=align==='right'?x+w-fw:x;
  if(fw>0){
    const fg=ctx.createLinearGradient(fx,y,fx,y+h);
    if(ratio>.5){
      fg.addColorStop(0,`hsl(${hue+18},85%,60%)`);
      fg.addColorStop(.5,`hsl(${hue},78%,42%)`);
      fg.addColorStop(1,`hsl(${hue-8},65%,26%)`);
    } else if(ratio>.25){
      fg.addColorStop(0,'#ff8828');fg.addColorStop(.5,'#cc4c0a');fg.addColorStop(1,'#7a1e00');
    } else {
      const pulse=.5+Math.sin(Date.now()*.009)*.5;
      fg.addColorStop(0,'#ff2828');fg.addColorStop(.5,`rgb(${200+Math.round(pulse*30)},${Math.round(pulse*18)},8)`);fg.addColorStop(1,'#5a0000');
    }
    ctx.fillStyle=fg;_roundRect(fx,y,fw,h,3);
    // shine strip
    const sh=ctx.createLinearGradient(0,y,0,y+h*.42);
    sh.addColorStop(0,'rgba(255,255,255,.2)');sh.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sh;_roundRect(fx,y,fw,h*.42,3);
    // edge glow
    if(ratio>.1){
      ctx.save();ctx.shadowColor=`hsla(${hue},85%,55%,.45)`;ctx.shadowBlur=5;
      ctx.strokeStyle=`hsla(${hue},80%,52%,.25)`;ctx.lineWidth=1;_roundRect(fx,y,fw,h,3,true);
      ctx.restore();
    }
  }
  // name
  ctx.font=`bold 15px "Bebas Neue",Impact,sans-serif`;ctx.textAlign=align==='left'?'left':'right';
  const tx=align==='left'?x+4:x+w-4;
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillText(name,tx+1,y+h-3);
  ctx.fillStyle=`hsl(${hue},92%,80%)`;ctx.fillText(name,tx,y+h-4);
  // hp%
  const hp=Math.ceil(ratio*100);
  ctx.font='bold 11px monospace';ctx.textAlign=align==='left'?'right':'left';
  ctx.fillStyle=ratio>.28?'rgba(255,255,255,.45)':'rgba(255,80,80,.85)';
  ctx.fillText(hp+'%',align==='left'?x+w-4:x+4,y+h-4);
}

function _roundRect(x,y,w,h,r,stroke=false){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);

function _makeDirtTex(){

  const cx2=c.getContext('2d');
  // grass base
  cx2.fillStyle='#2a5c0c';cx2.fillRect(0,0,256,256);
  // dirt patches (arena floor)
  for(let i=0;i<600;i++){
    const px=Math.random()*256,py=Math.random()*256,pr=Math.random()*3+0.8;
    const br=Math.round(110+Math.random()*50),bg=Math.round(70+Math.random()*30);
    cx2.fillStyle='rgba('+br+','+bg+',20,'+(Math.random()*.35+.1)+')';
    cx2.beginPath();cx2.arc(px,py,pr,0,Math.PI*2);cx2.fill();
  }
  // grass blades
  for(let i=0;i<120;i++){
    const gx=Math.random()*256,gy=Math.random()*256;
    cx2.strokeStyle='rgba(50,110,10,'+(Math.random()*.4+.2)+')';

}

  const shadow=new THREE.Mesh(
    new THREE.CircleGeometry(18,14),
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.28,depthWrite:false})
  );
  shadow.rotation.x=-Math.PI/2;shadow.position.y=0.3;
  group.add(shadow);

  // body pivot
  const body=new THREE.Group();group.add(body);

  const torso=new THREE.Mesh(new THREE.BoxGeometry(28,30,20),bodyMat);
  torso.position.set(0,46,0);torso.castShadow=true;body.add(torso);

  const belly=new THREE.Mesh(new THREE.SphereGeometry(11,7,6),bodyMat);
  belly.scale.set(1,0.85,1);belly.position.set(7,40,0);body.add(belly);

  // neck pivot
  const neck=new THREE.Group();neck.position.set(7,60,0);neck.rotation.z=-0.22;body.add(neck);
  const neckM=new THREE.Mesh(new THREE.CylinderGeometry(5.5,7.5,15,8),headMat);
  neckM.position.set(1.5,6,0);neck.add(neckM);

  // head pivot
  const head=new THREE.Group();head.position.set(0,17,0);neck.add(head);
  const headM=new THREE.Mesh(new THREE.SphereGeometry(10,10,7),headMat);
  headM.castShadow=true;head.add(headM);

  // eyes
  const eyeW=new THREE.Mesh(new THREE.SphereGeometry(2.5,6,5),new THREE.MeshBasicMaterial({color:0xffffff}));
  eyeW.position.set(7.5,2,5);head.add(eyeW);
  const pupil=new THREE.Mesh(new THREE.SphereGeometry(1.5,5,5),new THREE.MeshBasicMaterial({color:0x111111}));
  pupil.position.set(8,2,6.5);head.add(pupil);

  // beak
  const beak=new THREE.Mesh(new THREE.ConeGeometry(2.8,10,6),beakMat);
  beak.rotation.z=-Math.PI/2;beak.position.set(10,-0.5,0);head.add(beak);

  // comb (3 bumps)
  for(let ci=0;ci<3;ci++){
    const cb=new THREE.Mesh(new THREE.SphereGeometry(3.2-ci*0.3,6,5),combMat);
    cb.scale.y=1.6;cb.position.set(-3.5+ci*3.8,9.5+Math.abs(ci-1)*(-1.4),0);head.add(cb);
  }
  // wattle
  const wattle=new THREE.Mesh(new THREE.SphereGeometry(3.5,6,5),combMat);
  wattle.scale.set(0.9,1.1,0.8);wattle.position.set(6.5,-7,0);head.add(wattle);

  // tail
  const tail=new THREE.Group();tail.position.set(-13,54,0);tail.rotation.z=0.55;body.add(tail);
  for(let ti=0;ti<7;ti++){
    const tf=new THREE.Mesh(new THREE.PlaneGeometry(9+ti,22+ti*2),tailMat);
    tf.position.set(0,11,(ti-3)*5.5);tf.rotation.y=(ti-3)*0.15;
    tf.castShadow=true;tail.add(tf);
  }

  // wings
  const lWing=new THREE.Group();lWing.position.set(0,46,12);body.add(lWing);
  const lWM=new THREE.Mesh(new THREE.BoxGeometry(22,16,5),bodyMat);
  lWM.position.set(-1.5,0,2.5);lWM.rotation.z=0.2;lWing.add(lWM);
  const lWT=new THREE.Mesh(new THREE.PlaneGeometry(20,7),tailMat);
  lWT.position.set(-1.5,-5.5,2.5);lWT.rotation.z=0.15;lWing.add(lWT);

  const rWing=new THREE.Group();rWing.position.set(0,46,-12);body.add(rWing);
  const rWM=new THREE.Mesh(new THREE.BoxGeometry(22,16,5),bodyMat);
  rWM.position.set(-1.5,0,-2.5);rWM.rotation.z=0.2;rWing.add(rWM);
  const rWT=new THREE.Mesh(new THREE.PlaneGeometry(20,7),tailMat);
  rWT.position.set(-1.5,-5.5,-2.5);rWT.rotation.z=0.15;rWing.add(rWT);

  // legs
  const lLeg=new THREE.Group();lLeg.position.set(3.5,31,5.5);body.add(lLeg);
  const lTh=new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.2,15,7),legMat);
  lTh.position.set(0,-7,0);lTh.castShadow=true;lLeg.add(lTh);
  const lSh=new THREE.Mesh(new THREE.CylinderGeometry(3.2,2.2,13,7),legMat);
  lSh.position.set(2,-21,0);lSh.rotation.z=-0.2;lLeg.add(lSh);
  const lSp=new THREE.Mesh(new THREE.ConeGeometry(2.2,8,6),legMat);
  lSp.rotation.z=-Math.PI/2;lSp.position.set(5.5,-25,0);lLeg.add(lSp);

  const rLeg=new THREE.Group();rLeg.position.set(3.5,31,-5.5);body.add(rLeg);
  const rTh=new THREE.Mesh(new THREE.CylinderGeometry(3.8,3.2,15,7),legMat);
  rTh.position.set(0,-7,0);rTh.castShadow=true;rLeg.add(rTh);
  const rSh=new THREE.Mesh(new THREE.CylinderGeometry(3.2,2.2,13,7),legMat);
  rSh.position.set(2,-21,0);rSh.rotation.z=-0.2;rLeg.add(rSh);
  const rSp=new THREE.Mesh(new THREE.ConeGeometry(2.2,8,6),legMat);
  rSp.rotation.z=-Math.PI/2;rSp.position.set(5.5,-25,0);rLeg.add(rSp);

  // element glow
  const elCol=new THREE.Color().setHSL(featherHue/360,1,0.6);
  const elLight=new THREE.PointLight(elCol,0.5,105);
  elLight.position.set(0,48,0);group.add(elLight);

  return {group,body,neck,head,tail,lWing,rWing,lLeg,rLeg,elLight};
}

function render3D(shakeX,shakeY){
  if(!renderer3)return;
  const t=Date.now()*.001;
  // animate arena ring (daytime warm glow)
  if(_arenaRing)_arenaRing.material.opacity=0.50+Math.sin(t*1.8)*0.12;
  // camera shake
  camera3.position.x=shakeX*0.28;
  camera3.position.y=190+Math.abs(shakeY)*0.28;
  renderer3.render(scene3,camera3);
}

// init after DOM ready
window.addEventListener('load',function(){
  try{ init3D(); }catch(e){ console.error('3D init failed:',e); }
});

function startGame(r1,r2){
  const c1={left:'KeyA',right:'KeyD',jump:'KeyW',atk:'KeyF',spur:'KeyG',special:'KeyH'};
  const c2={left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',atk:'Enter',spur:'Backspace',special:'Slash'};
  p1=new Player({...r1,startX:200,  facing:1,  ctrl:c1});
  p2=new Player({...r2,startX:W-250,facing:-1, ctrl:c2});
  tLeft=RT;winner=null;PT.length=0;gState='playing';
  K['Enter']=K['NumpadEnter']=K['ArrowUp']=K['KeyW']=false;
}

function checkEnd(){
  if(p1.dead&&!p2.dead)     {winner=p2;gState='over';}
  else if(p2.dead&&!p1.dead){winner=p1;gState='over';}
  else if(p1.dead&&p2.dead) {winner=null;gState='over';}
  else if(tLeft<=0){winner=p1.hp>p2.hp?p1:p2.hp>p1.hp?p2:null;gState='over';}
}

/* ── MAIN LOOP ───────────────────────────────────────────────────── */
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
  tickShake();

  if(gState==='menu'){
    render3D(0,0);
    drawMenu();
    if(K['Enter']||K['NumpadEnter']){
      K['Enter']=K['NumpadEnter']=false;KQ.length=0;
      cs.p1OK=false;cs.p2OK=false;gState='charSelect';
    }
  }
  else if(gState==='charSelect'){
    render3D(0,0);
    drawCharSelect();
  }
  else if(gState==='playing'){
    tLeft-=dt;p1.update(p2);p2.update(p1);tickP();checkEnd();
    render3D(sx,sy);
    ctx.save();ctx.translate(sx,sy);
    ctx.clearRect(-sx-2,-sy-2,W+4,H+4);
    p1.draw();p2.draw();drawP();drawHUD(p1,p2,tLeft);
    ctx.restore();
    drawUltAnn();
  }
  else if(gState==='over'){
    drawGameOver();
    if(K['Enter']||K['NumpadEnter']){
      K['Enter']=K['NumpadEnter']=false;KQ.length=0;pulse=0;
      cs.p1OK=false;cs.p2OK=false;gState='charSelect';
    }
  }
  requestAnimationFrame(loop);
}

document.fonts.ready.then(()=>
  requestAnimationFrame(ts=>{lastT=ts;requestAnimationFrame(loop);})
);
</script>
