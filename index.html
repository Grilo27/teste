<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rinha de Galo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a00;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      border: 3px solid #8B4513;
      box-shadow: 0 0 40px #8B451380;
    }
    #controls-hint {
      color: #c8a96e;
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls-hint">
  P1: W/A/D → mover | F → bicada | G → esporão &nbsp;|&nbsp;
  P2: ↑/←/→ → mover | / → bicada | RShift → esporão
</div>
<script>
const W = 960, H = 540;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

const GROUND_Y = 460;
const PLATFORMS = [
  { x: 0,   y: GROUND_Y, w: W,   h: 80 },
  { x: 120, y: 360,      w: 180, h: 18 },
  { x: 660, y: 360,      w: 180, h: 18 },
  { x: 390, y: 290,      w: 180, h: 18 },
];

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function hslStr(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }
function rr(min, max) { return Math.random() * (max - min) + min; }

const particles = [];
function spawnParticles(x, y, count, hue) {
  for (let i = 0; i < count; i++) {
    const angle = rr(0, Math.PI * 2);
    const speed = rr(1, 5);
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-2, life:1, decay:rr(0.04,0.08), hue, size:rr(2,5) });
  }
}
function updateParticles() {
  for (let i = particles.length-1; i>=0; i--) {
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=hslStr(p.hue,80,60);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}

let shakeX=0,shakeY=0,shakeMag=0;
function triggerShake(mag){shakeMag=Math.max(shakeMag,mag);}
function updateShake(){
  if(shakeMag>0.2){shakeX=rr(-shakeMag,shakeMag);shakeY=rr(-shakeMag,shakeMag);shakeMag*=0.7;}
  else{shakeX=shakeY=shakeMag=0;}
}

const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

class Player {
  constructor(cfg){
    this.name=cfg.name; this.startX=cfg.startX;
    this.x=cfg.startX; this.y=GROUND_Y-62;
    this.vx=0; this.vy=0; this.w=50; this.h=62;
    this.facing=cfg.facing; this.ctrl=cfg.ctrl;
    this.feathers=cfg.feathers; this.comb=cfg.comb;
    this.maxHp=100; this.hp=100;
    this.grounded=false; this.canJump=false;
    this.atkCD=0; this.spurCD=0; this.atkTimer=0; this.spurTimer=0;
    this.hitTimer=0; this.dead=false; this.deathAnim=0;
    this.animT=0; this.wingFlap=0; this.state='idle';
  }
  reset(){
    this.x=this.startX; this.y=GROUND_Y-62;
    this.vx=0; this.vy=0; this.hp=this.maxHp;
    this.grounded=false;
    this.atkCD=this.spurCD=this.atkTimer=this.spurTimer=0;
    this.hitTimer=0; this.dead=false; this.deathAnim=0; this.state='idle';
  }
  update(other){
    if(this.dead){this.deathAnim=Math.min(this.deathAnim+0.05,1);return;}
    if(this.atkCD>0)this.atkCD--;
    if(this.spurCD>0)this.spurCD--;
    if(this.hitTimer>0)this.hitTimer--;
    if(this.atkTimer>0)this.atkTimer--;
    if(this.spurTimer>0)this.spurTimer--;
    const left=keys[this.ctrl.left],right=keys[this.ctrl.right];
    const jump=keys[this.ctrl.jump],atk=keys[this.ctrl.atk],spur=keys[this.ctrl.spur];
    if(!left&&!right&&other) this.facing=other.x>this.x?1:-1;
    if(left){this.vx=-5;this.facing=-1;}
    else if(right){this.vx=5;this.facing=1;}
    else this.vx*=0.72;
    if(jump&&this.grounded&&this.canJump){this.vy=-13.5;this.grounded=false;this.canJump=false;this.wingFlap=10;}
    if(!jump)this.canJump=true;
    if(atk&&this.atkCD===0&&this.atkTimer===0){this.atkTimer=14;this.atkCD=38;}
    if(spur&&this.spurCD===0&&this.spurTimer===0){this.spurTimer=20;this.spurCD=75;}
    this.vy+=0.62; this.x+=this.vx; this.y+=this.vy;
    this.grounded=false;
    for(const p of PLATFORMS){
      if(this.x+this.w>p.x+4&&this.x<p.x+p.w-4&&this.vy>=0&&this.y+this.h>p.y&&this.y+this.h<p.y+p.h+22){
        this.y=p.y-this.h;this.vy=0;this.grounded=true;
      }
    }
    this.x=clamp(this.x,0,W-this.w);
    if(this.y>H+60){this.y=GROUND_Y-this.h;this.vy=0;}
    if(this.wingFlap>0)this.wingFlap--;
    if(Math.abs(this.vx)>0.5&&this.grounded)this.animT++;
    if(this.hitTimer>20)this.state='hit';
    else if(this.atkTimer>0)this.state='peck';
    else if(this.spurTimer>0)this.state='spur';
    else if(!this.grounded)this.state='air';
    else if(Math.abs(this.vx)>0.6)this.state='walk';
    else this.state='idle';
    if(other&&!other.dead&&other.hitTimer===0){
      if(this.atkTimer>0){
        const hbx=this.x+(this.facing>0?this.w+5:-35);
        if(rectsOverlap(hbx,this.y+5,35,22,other.x,other.y,other.w,other.h)){
          other.hp=Math.max(0,other.hp-9);other.hitTimer=28;
          other.vx=this.facing*3.5;other.vy=-2.5;
          spawnParticles(other.x+other.w/2,other.y+10,8,0);
          triggerShake(3);if(other.hp<=0)other.dead=true;
        }
      }
      if(this.spurTimer>5){
        const hbx=this.x+(this.facing>0?this.w-10:-45),hby=this.y+28;
        if(rectsOverlap(hbx,hby,50,32,other.x,other.y,other.w,other.h)){
          other.hp=Math.max(0,other.hp-20);other.hitTimer=38;
          other.vx=this.facing*7;other.vy=-5;
          spawnParticles(other.x+other.w/2,other.y+30,14,15);
          triggerShake(7);if(other.hp<=0)other.dead=true;
        }
      }
    }
  }
  draw(){
    ctx.save();
    const cx=this.x+this.w/2,base=this.y+this.h;
    if(this.dead){
      const angle=this.deathAnim*Math.PI*0.5*(this.facing>0?-1:1);
      ctx.translate(cx,base);ctx.rotate(angle);ctx.translate(-cx,-base);
    }
    const flash=this.hitTimer>0&&Math.floor(this.hitTimer/3)%2===0;
    if(flash)ctx.globalAlpha=0.35;
    this.drawRooster(ctx,cx,base);
    ctx.restore();
    if(this.atkTimer>8)this.drawPeckEffect(cx,base);
    if(this.spurTimer>10)this.drawSpurEffect(cx,base);
  }
  drawRooster(ctx,cx,groundY){
    const f=this.facing;
    const bob=this.state==='idle'?Math.sin(Date.now()*0.004)*2:0;
    const walkLeg=Math.sin(this.animT*0.4)*10;
    const bx=cx,by=groundY-30+bob;
    ctx.lineWidth=3.5;ctx.strokeStyle=hslStr(this.feathers-10,40,40);ctx.lineCap='round';
    const l1x=bx-f*6,l1swing=this.state==='walk'?walkLeg:0;
    ctx.beginPath();ctx.moveTo(l1x,by+12);ctx.lineTo(l1x-f*2,groundY-l1swing);ctx.stroke();
    drawClaw(ctx,l1x-f*2,groundY-l1swing,f,hslStr(30,50,55));
    const l2x=bx+f*6;
    ctx.beginPath();ctx.moveTo(l2x,by+14);ctx.lineTo(l2x+f*2,groundY+l1swing*0.5);ctx.stroke();
    drawClaw(ctx,l2x+f*2,groundY+l1swing*0.5,f,hslStr(30,50,55));
    if(this.state==='spur'){
      ctx.strokeStyle='#aaa';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(l2x,groundY-8);ctx.lineTo(l2x+f*22,groundY-15);ctx.stroke();
      ctx.fillStyle='#ccc';ctx.beginPath();
      ctx.moveTo(l2x+f*22,groundY-15);ctx.lineTo(l2x+f*30,groundY-22);ctx.lineTo(l2x+f*24,groundY-10);ctx.fill();
    }
    const tailBase=bx-f*18;
    for(let i=-2;i<=2;i++){
      const spread=(i/2)*0.55,angle=(f<0?0:Math.PI)+spread-0.15,len=28+Math.abs(i)*5;
      ctx.strokeStyle=hslStr(this.feathers+i*10,70,38);ctx.lineWidth=3.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(tailBase,by-2);
      ctx.lineTo(tailBase+Math.cos(angle)*len,by-2+Math.sin(angle)*len-8);ctx.stroke();
    }
    ctx.fillStyle=hslStr(this.feathers,72,48);
    ctx.beginPath();ctx.ellipse(bx,by,24,20,0.15*f,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=hslStr(this.feathers,40,20);ctx.lineWidth=1.5;ctx.stroke();
    const wFlapAng=this.wingFlap>0||this.state==='air'?-0.4*f:this.state==='peck'?-0.25*f:0.05*f;
    ctx.fillStyle=hslStr(this.feathers,65,35);
    ctx.save();ctx.translate(bx,by-2);ctx.rotate(wFlapAng);
    ctx.beginPath();ctx.ellipse(0,0,18,11,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=hslStr(this.feathers,40,18);ctx.lineWidth=1;ctx.stroke();ctx.restore();
    const headX=bx+f*20,headY=by-28;
    ctx.strokeStyle=hslStr(this.feathers,72,48);ctx.lineWidth=9;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(bx+f*8,by-10);ctx.quadraticCurveTo(bx+f*16,by-18,headX,headY+10);ctx.stroke();
    ctx.fillStyle=hslStr(this.feathers,72,50);
    ctx.beginPath();ctx.arc(headX,headY,13,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=hslStr(this.feathers,40,20);ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=hslStr(this.comb,90,45);
    ctx.beginPath();
    ctx.moveTo(headX-8,headY-9);ctx.lineTo(headX-5,headY-20);ctx.lineTo(headX-1,headY-13);
    ctx.lineTo(headX+2,headY-23);ctx.lineTo(headX+5,headY-13);ctx.lineTo(headX+8,headY-20);
    ctx.lineTo(headX+9,headY-10);ctx.closePath();ctx.fill();
    ctx.fillStyle=hslStr(this.comb,85,40);
    ctx.beginPath();ctx.ellipse(headX+f*9,headY+7,5,8,0.3*f,0,Math.PI*2);ctx.fill();
    const beakPunch=this.state==='peck'?f*10:0;
    ctx.fillStyle='#E0C050';
    ctx.beginPath();ctx.moveTo(headX+f*11+beakPunch,headY-3);
    ctx.lineTo(headX+f*22+beakPunch,headY-1);ctx.lineTo(headX+f*11+beakPunch,headY+4);
    ctx.closePath();ctx.fill();ctx.strokeStyle='#9B8000';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(headX+f*5,headY-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(headX+f*5+1,headY-5,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#FF8C00';ctx.beginPath();ctx.arc(headX+f*5,headY-4,2,0,Math.PI*2);
    ctx.globalCompositeOperation='source-atop';ctx.fill();ctx.globalCompositeOperation='source-over';
    ctx.font='bold 13px Georgia';ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(cx-28,this.y-22,56,18);
    ctx.fillStyle=hslStr(this.feathers,90,85);ctx.fillText(this.name,cx,this.y-8);
  }
  drawPeckEffect(cx,base){
    const f=this.facing,ex=cx+f*36,ey=base-52;
    ctx.save();ctx.strokeStyle='rgba(255,240,80,0.7)';ctx.lineWidth=2;
    for(let i=0;i<5;i++){const a=(i/5)*Math.PI*2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a)*14,ey+Math.sin(a)*14);ctx.stroke();}
    ctx.restore();
  }
  drawSpurEffect(cx,base){
    const f=this.facing,ex=cx+f*28,ey=base-20;
    ctx.save();ctx.globalAlpha=0.55;ctx.strokeStyle='#ff6600';ctx.lineWidth=3;
    for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex+Math.cos(a)*20,ey+Math.sin(a)*20);ctx.stroke();}
    ctx.restore();
  }
}

function drawClaw(ctx,x,y,f,color){
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineCap='round';
  for(const[dx,dy] of [[1.1,0.4],[0.5,0.9],[-0.2,0.7]]){
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*f*8,y+dy*7);ctx.stroke();
  }
}
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function drawArena(){
  const skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#3d1800');skyGrad.addColorStop(0.6,'#7a3210');skyGrad.addColorStop(1,'#4a1e00');
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,H);
  drawCrowd();
  ctx.fillStyle='#5a2800';ctx.fillRect(0,GROUND_Y+72,W,8);
  ctx.fillStyle='#3d1800';
  for(let x=0;x<W;x+=28)ctx.fillRect(x+2,GROUND_Y+52,8,30);
  const dirtGrad=ctx.createLinearGradient(0,GROUND_Y-10,0,GROUND_Y+80);
  dirtGrad.addColorStop(0,'#c87940');dirtGrad.addColorStop(0.3,'#a0582a');dirtGrad.addColorStop(1,'#7a3810');
  ctx.fillStyle=dirtGrad;ctx.fillRect(0,GROUND_Y,W,80);
  ctx.strokeStyle='rgba(80,30,0,0.3)';ctx.lineWidth=1;
  for(let i=0;i<12;i++){const y=GROUND_Y+5+i*6;ctx.beginPath();ctx.moveTo(rr(0,20),y);ctx.lineTo(W-rr(0,20),y+rr(-2,2));ctx.stroke();}
  for(let i=1;i<PLATFORMS.length;i++){
    const p=PLATFORMS[i],pg=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    pg.addColorStop(0,'#c87940');pg.addColorStop(1,'#7a3810');
    ctx.fillStyle=pg;ctx.fillRect(p.x,p.y,p.w,p.h+4);
    ctx.strokeStyle='#5a2800';ctx.lineWidth=2;ctx.strokeRect(p.x,p.y,p.w,p.h+4);
  }
  ctx.save();ctx.beginPath();ctx.ellipse(W/2,GROUND_Y+2,200,25,0,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,200,100,0.2)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  drawTorch(80,380);drawTorch(W-80,380);drawTorch(W/2,220);
}
function drawCrowd(){
  for(let x=0;x<W;x+=22){
    const h=30+Math.sin(x*0.1)*15,y=GROUND_Y+60-h;
    ctx.fillStyle=`hsl(${20+(x%60)},30%,${12+(x%5)*2}%)`;
    ctx.beginPath();ctx.arc(x+11,y,11,0,Math.PI);ctx.rect(x,y,22,h);ctx.fill();
  }
}
function drawTorch(x,y){
  ctx.strokeStyle='#5a2800';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x,y+40);ctx.lineTo(x,y);ctx.stroke();
  const flicker=Math.sin(Date.now()*0.008)*4;
  ctx.save();ctx.globalAlpha=0.85;
  const fg=ctx.createRadialGradient(x,y,2,x,y-10,20);
  fg.addColorStop(0,'rgba(255,240,100,0.9)');fg.addColorStop(0.5,'rgba(255,100,0,0.7)');fg.addColorStop(1,'rgba(255,0,0,0)');
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(x,y-8+flicker*0.3,16+flicker*0.4,0,Math.PI*2);ctx.fill();ctx.restore();
}

function drawHUD(p1,p2,timeLeft){
  const pad=20,barW=340,barH=22;
  drawHPBar(pad,pad,barW,barH,p1.hp/p1.maxHp,`hsl(${p1.feathers},80%,55%)`,p1.name,'left');
  drawHPBar(W-pad-barW,pad,barW,barH,p2.hp/p2.maxHp,`hsl(${p2.feathers},80%,55%)`,p2.name,'right');
  const ts=Math.ceil(timeLeft),timerStr=ts>0?String(ts):'FIM';
  ctx.font='bold 28px Georgia';ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(W/2-32,8,64,38);
  ctx.strokeStyle='#8B4513';ctx.lineWidth=2;ctx.strokeRect(W/2-32,8,64,38);
  ctx.fillStyle=ts<=10?'#ff4444':'#ffe0a0';ctx.fillText(timerStr,W/2,38);
  ctx.font='11px Georgia';ctx.fillStyle='rgba(255,200,100,0.5)';ctx.fillText('RINHA DE GALO',W/2,60);
  drawCooldownBar(p1,pad,pad+barH+8,'left');
  drawCooldownBar(p2,W-pad-barW,pad+barH+8,'right');
}
function drawHPBar(x,y,w,h,ratio,color,name,align){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.strokeStyle='#8B4513';ctx.lineWidth=2;ctx.strokeRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#2a0a00';ctx.fillRect(x,y,w,h);
  const fillW=w*Math.max(0,ratio),fx=align==='right'?x+w-fillW:x;
  const hg=ctx.createLinearGradient(fx,y,fx+fillW,y);
  if(ratio>0.5){hg.addColorStop(0,color);hg.addColorStop(1,'#80ff80');}
  else if(ratio>0.25){hg.addColorStop(0,'#ffaa00');hg.addColorStop(1,color);}
  else{hg.addColorStop(0,'#ff2200');hg.addColorStop(1,'#ff6600');}
  ctx.fillStyle=hg;ctx.fillRect(fx,y,fillW,h);
  ctx.font=`bold ${h-4}px Georgia`;ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.fillText(name,x+w/2,y+h-4);
}
function drawCooldownBar(p,x,y,align){
  const bw=340,bh=8,gap=4;
  drawMiniCool(x,y,bw/2-gap,bh,1-p.atkCD/38,'#FFD700','F Bicada',align);
  drawMiniCool(x+bw/2+gap,y,bw/2-gap,bh,1-p.spurCD/75,'#FF6600','G Esporão',align);
}
function drawMiniCool(x,y,w,h,ratio,color,label){
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(x,y,w,h);
  ctx.fillStyle=ratio>=1?color:'rgba(150,80,0,0.6)';ctx.fillRect(x,y,w*clamp(ratio,0,1),h);
  ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillStyle='rgba(255,220,150,0.8)';ctx.fillText(label,x+w/2,y+h-1);
}

const p1=new Player({name:'VERMELHO',startX:200,facing:1,ctrl:{left:'KeyA',right:'KeyD',jump:'KeyW',atk:'KeyF',spur:'KeyG'},feathers:15,comb:0});
const p2=new Player({name:'DOURADO',startX:W-250,facing:-1,ctrl:{left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',atk:'Slash',spur:'ShiftRight'},feathers:42,comb:5});

const ROUND_TIME=90;
let gameState='menu',timeLeft=ROUND_TIME,winner=null,lastTime=0,menuPulse=0;

function startGame(){p1.reset();p2.reset();timeLeft=ROUND_TIME;winner=null;particles.length=0;gameState='playing';}

function checkRoundEnd(){
  if(p1.dead&&!p2.dead){winner=p2;gameState='over';}
  else if(p2.dead&&!p1.dead){winner=p1;gameState='over';}
  else if(p1.dead&&p2.dead){winner=null;gameState='over';}
  else if(timeLeft<=0){
    if(p1.hp>p2.hp)winner=p1;
    else if(p2.hp>p1.hp)winner=p2;
    else winner=null;
    gameState='over';
  }
}

function drawMenu(){
  drawArena();menuPulse+=0.04;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.font='bold 72px Georgia';
  const grd=ctx.createLinearGradient(W/2-200,0,W/2+200,0);
  grd.addColorStop(0,'#ff6600');grd.addColorStop(0.5,'#FFD700');grd.addColorStop(1,'#ff6600');
  ctx.fillStyle=grd;ctx.shadowColor='#ff3300';ctx.shadowBlur=20;
  ctx.fillText('RINHA DE GALO',W/2,180);ctx.shadowBlur=0;
  ctx.font='26px Georgia';ctx.fillStyle='#c8a96e';
  ctx.fillText('2 JOGADORES — MESMO TECLADO',W/2,230);
  const alpha=0.7+Math.sin(menuPulse)*0.3;
  ctx.font='bold 18px Georgia';ctx.fillStyle=`rgba(255,220,120,${alpha})`;
  ctx.fillText('Pressione ENTER para começar',W/2,340);
  drawControlCard(140,390,p1);drawControlCard(W-380,390,p2);
}
function drawControlCard(x,y,p){
  const w=240,h=100;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=`hsl(${p.feathers},70%,50%)`;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
  ctx.font='bold 14px Georgia';ctx.textAlign='left';
  ctx.fillStyle=`hsl(${p.feathers},90%,75%)`;ctx.fillText(p.name,x+10,y+20);
  ctx.font='12px monospace';ctx.fillStyle='#ddd';
  const isP1=p===p1;
  const lines=isP1?['W / A / D  →  mover','F  →  bicada  (rápida)','G  →  esporão  (forte)']:['↑ / ← / →  →  mover','/  →  bicada  (rápida)','RShift  →  esporão  (forte)'];
  lines.forEach((l,i)=>ctx.fillText(l,x+10,y+42+i*18));
}
function drawGameOver(){
  drawArena();p1.draw();p2.draw();drawParticles();drawHUD(p1,p2,timeLeft);
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.font='bold 58px Georgia';
  const grd=ctx.createLinearGradient(W/2-200,0,W/2+200,0);
  grd.addColorStop(0,'#ff3300');grd.addColorStop(0.5,'#FFD700');grd.addColorStop(1,'#ff3300');
  ctx.fillStyle=grd;ctx.shadowColor='#ff3300';ctx.shadowBlur=18;
  ctx.fillText(winner?`${winner.name} VENCEU!`:'EMPATE!',W/2,H/2-20);ctx.shadowBlur=0;
  menuPulse+=0.04;
  const alpha=0.6+Math.sin(menuPulse)*0.4;
  ctx.font='bold 20px Georgia';ctx.fillStyle=`rgba(255,220,120,${alpha})`;
  ctx.fillText('Pressione ENTER para jogar novamente',W/2,H/2+50);
}

function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;
  updateShake();
  if(gameState==='menu'){drawMenu();if(keys['Enter']||keys['NumpadEnter']){keys['Enter']=keys['NumpadEnter']=false;startGame();}}
  else if(gameState==='playing'){
    timeLeft-=dt;p1.update(p2);p2.update(p1);updateParticles();checkRoundEnd();
    ctx.save();ctx.translate(shakeX,shakeY);
    drawArena();p1.draw();p2.draw();drawParticles();drawHUD(p1,p2,timeLeft);
    ctx.restore();
  }
  else if(gameState==='over'){drawGameOver();if(keys['Enter']||keys['NumpadEnter']){keys['Enter']=keys['NumpadEnter']=false;menuPulse=0;startGame();}}
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{lastTime=ts;requestAnimationFrame(loop);});
</script>
